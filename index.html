<style>
:root{
  color-scheme:dark;
  --bg:#000000;
  --fg:#d6d6d6;
  --dim:#6a6a6a;
  --faint:#4a4a4a;
  --accent:#FFB000;
  --work:#FFB000;
  --life:#2EC4B6;
  --rule:#1e1e1e;
  --rule-soft:#141414;
  --out:#242424;
  --sans:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif;
  --mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,"Liberation Mono",monospace;
  --pad:14px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{
  margin:0;background:var(--bg);color:var(--fg);
  font-family:var(--sans);font-size:14px;line-height:1.5;
  -webkit-font-smoothing:antialiased;
  overscroll-behavior-y:none;
}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
input,select,textarea{font:inherit;color:inherit;background:var(--bg);border:1px solid var(--rule);padding:9px 10px;width:100%;border-radius:0}
input:focus,select:focus,textarea:focus{outline:1px solid var(--accent);outline-offset:-1px;border-color:var(--accent)}
:focus-visible{outline:1px solid var(--accent);outline-offset:1px}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
#app{display:flex;flex-direction:column;height:100dvh;max-width:640px;margin:0 auto;position:relative}
.scroll{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch}
.top{display:flex;align-items:baseline;justify-content:space-between;padding:calc(env(safe-area-inset-top) + 13px) var(--pad) 7px;flex-shrink:0}
.brand{font-family:var(--mono);font-size:12.5px;letter-spacing:.06em;color:var(--dim)}
.today{font-family:var(--mono);font-size:11.5px;letter-spacing:.05em;color:var(--dim)}
.sync{font-family:var(--mono);font-size:10.5px;color:var(--faint);margin-left:8px;letter-spacing:.02em}
.cmd{padding:0 var(--pad) 11px;font-family:var(--mono);font-size:12px;color:var(--dim);flex-shrink:0}
.cmd b{color:var(--accent);font-weight:500}
.caret{display:inline-block;width:7px;height:12px;background:var(--accent);vertical-align:-2px;margin-left:3px;animation:blink 1.06s step-end infinite}
@keyframes blink{0%,49%{opacity:1}50%,100%{opacity:0}}
.tabsel{display:flex;padding:0 var(--pad) 11px;flex-shrink:0;border-bottom:1px solid var(--rule)}
.tabsel button{
  font-family:var(--mono);font-size:11.5px;letter-spacing:.02em;color:var(--dim);
  padding:3px 10px;border:1px solid var(--rule);margin-right:-1px;transition:color .16s,background .16s,border-color .16s;
}
.tabsel button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:#000;font-weight:600}
.row{display:grid;grid-template-columns:28px 1fr auto;gap:9px;padding:11px var(--pad);border-bottom:1px solid var(--rule-soft);align-items:baseline;animation:rowin .26s ease both}
@keyframes rowin{from{opacity:0;transform:translateX(-7px)}to{opacity:1;transform:none}}
.row .box{font-family:var(--mono);font-size:13px;color:var(--dim);text-align:left;transition:color .18s;line-height:1.45}
.row .box:hover{color:var(--accent)}
.row.done .box{color:var(--accent)}
.row .body{min-width:0}
.row .ttl{font-size:13.5px;line-height:1.4;word-break:break-word;transition:color .2s,opacity .2s}
.row.done .ttl{color:var(--faint);text-decoration:line-through}
.row .meta{font-family:var(--mono);font-size:10.5px;color:var(--dim);margin-top:3px;letter-spacing:.02em}
.row .meta .sep{color:var(--faint);margin:0 5px}
.cat{display:inline-block;width:6px;height:6px;margin-right:6px;vertical-align:1px;background:var(--work)}
.cat.life{background:var(--life)}
.row.done .cat{opacity:.4}
.row .note{
  font-size:11.5px;color:var(--faint);margin-top:5px;line-height:1.45;
  padding-left:8px;border-left:1px solid var(--rule);
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
}
.row.done .note{opacity:.5}
.row .d{font-family:var(--mono);font-size:11px;color:var(--dim);font-variant-numeric:tabular-nums;white-space:nowrap}
.row .d.hot{color:var(--accent)}
.row .d.over{color:var(--accent);font-weight:600}
.row .body[role="button"]{cursor:pointer}
.empty{padding:44px var(--pad);text-align:center;color:var(--faint);font-family:var(--mono);font-size:12px;line-height:1.9}
.empty b{display:block;color:var(--dim);font-weight:400;margin-bottom:6px}
.tabs{display:flex;border-top:1px solid var(--rule);flex-shrink:0;padding-bottom:env(safe-area-inset-bottom)}
.tabs button{flex:1;padding:12px 0;font-family:var(--mono);font-size:11px;letter-spacing:.08em;color:var(--dim);border-right:1px solid var(--rule)}
.tabs button:last-child{border-right:0}
.tabs button[aria-current="page"]{color:var(--accent)}
.fab{
  position:absolute;right:16px;bottom:calc(env(safe-area-inset-bottom) + 62px);
  width:46px;height:46px;border:1px solid var(--accent);color:var(--accent);background:var(--bg);
  font-size:21px;line-height:1;display:flex;align-items:center;justify-content:center;
  transition:background .18s,color .18s;z-index:5;
}
.fab:hover{background:var(--accent);color:#000}
.banner{
  font-family:var(--mono);font-size:11px;padding:8px var(--pad);flex-shrink:0;
  border-bottom:1px solid var(--rule);display:flex;gap:9px;align-items:center;
}
.banner.warn{color:var(--accent)}
.banner button{font-family:var(--mono);font-size:11px;color:var(--accent);text-decoration:underline;margin-left:auto}
.sheet{position:fixed;inset:0;background:var(--bg);z-index:50;display:flex;align-items:stretch;justify-content:center;animation:fade .18s ease}
@keyframes fade{from{opacity:0}to{opacity:1}}
.sheet-in{
  width:100%;max-width:640px;height:100dvh;overflow-y:auto;background:var(--bg);
  padding:0 var(--pad) calc(env(safe-area-inset-bottom) + 24px);
  animation:slideup .26s cubic-bezier(.22,1,.36,1);
}
@keyframes slideup{from{transform:translateY(14px);opacity:.4}to{transform:none;opacity:1}}
.sheet-hd{
  display:flex;align-items:baseline;justify-content:space-between;
  position:sticky;top:0;z-index:2;background:var(--bg);
  padding:calc(env(safe-area-inset-top) + 15px) 0 11px;margin-bottom:14px;
  border-bottom:1px solid var(--rule);
}
.sheet-hd h2{margin:0;font-family:var(--mono);font-size:12.5px;font-weight:500;letter-spacing:.06em;color:var(--accent)}
.sheet-hd button{font-family:var(--mono);font-size:11.5px;color:var(--dim)}
.seg{display:flex;margin-bottom:17px}
.seg button{
  flex:1;font-family:var(--mono);font-size:12px;padding:9px 0;
  border:1px solid var(--rule);color:var(--dim);margin-right:-1px;
  transition:background .16s,color .16s,border-color .16s;
}
.seg button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:#000;font-weight:600}
.field{margin-bottom:13px}
.field label{display:block;font-family:var(--mono);font-size:10.5px;letter-spacing:.09em;color:var(--dim);margin-bottom:5px}
.pick{display:flex;flex-wrap:wrap;gap:0}
.pick button{
  font-family:var(--mono);font-size:11.5px;padding:7px 13px;border:1px solid var(--rule);
  color:var(--dim);margin-right:-1px;margin-bottom:-1px;transition:background .16s,color .16s,border-color .16s;
}
.pick button[aria-pressed="true"]{border-color:var(--accent);color:var(--accent);font-weight:600;position:relative;z-index:1}
.duo{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.actions{display:flex;gap:9px;margin-top:17px}
.actions button{flex:1;padding:12px 0;border:1px solid var(--rule);font-family:var(--mono);font-size:12px;color:var(--dim);transition:background .16s,color .16s,border-color .16s}
.actions button.go{border-color:var(--accent);color:var(--accent)}
.actions button.go:hover{background:var(--accent);color:#000}
.actions button.danger{color:var(--accent)}
.hintline{font-family:var(--mono);font-size:10.5px;color:var(--faint);margin-top:8px;line-height:1.7}
.calhd{display:flex;align-items:center;justify-content:space-between;padding:12px var(--pad) 10px}
.calhd .ym{font-family:var(--mono);font-size:14px;letter-spacing:.03em}
.calhd button{font-family:var(--mono);font-size:15px;color:var(--dim);padding:2px 11px;border:1px solid var(--rule)}
.dow,.grid{display:grid;grid-template-columns:repeat(7,1fr)}
.dow div{text-align:center;font-family:var(--mono);font-size:10px;color:var(--faint);padding:5px 0;letter-spacing:.04em}
.grid{border-top:1px solid var(--rule)}
.cell{
  aspect-ratio:1/1;border-right:1px solid var(--rule-soft);border-bottom:1px solid var(--rule-soft);
  display:flex;flex-direction:column;align-items:center;justify-content:flex-start;gap:3px;padding-top:6px;
  font-family:var(--mono);font-size:11.5px;color:var(--dim);transition:background .16s;
}
.cell:nth-child(7n){border-right:0}
.cell.out{color:var(--out)}
.cell.today{color:var(--accent)}
.cell[aria-pressed="true"]{background:var(--rule)}
.cell .dots{display:flex;gap:2px;height:4px}
.cell .dots i{width:4px;height:4px;background:var(--work);display:block}
.cell .dots i.life{background:var(--life)}
.cell .dots i.done{background:var(--faint)}
.cell .num.hot{text-decoration:underline;text-decoration-color:var(--accent);text-underline-offset:3px;text-decoration-thickness:1px}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;padding:9px var(--pad);font-family:var(--mono);font-size:10.5px;color:var(--dim);border-bottom:1px solid var(--rule)}
.legend i{display:inline-block;width:6px;height:6px;margin-right:6px;vertical-align:1px;background:var(--work)}
.legend i.life{background:var(--life)}
.legend u{text-decoration-color:var(--accent);text-underline-offset:3px}
.daylist{border-top:1px solid var(--rule);padding-top:4px}
.daylist .hd{font-family:var(--mono);font-size:11px;color:var(--dim);padding:9px var(--pad) 4px;letter-spacing:.04em}
.sect{padding:16px var(--pad) 6px;font-family:var(--mono);font-size:10.5px;letter-spacing:.11em;color:var(--faint)}
.sect-row{display:flex;align-items:center;justify-content:space-between;padding:16px var(--pad) 8px;border-bottom:1px solid var(--rule)}
.sect-row .sect{padding:0}
.mini{font-family:var(--mono);font-size:11.5px;color:var(--accent);border:1px solid var(--accent);padding:6px 12px;transition:background .16s,color .16s}
.mini:hover{background:var(--accent);color:#000}
.line{display:flex;align-items:center;gap:10px;padding:12px var(--pad);border-bottom:1px solid var(--rule-soft)}
.line[role="button"]{cursor:pointer;transition:background .16s}
.line[role="button"]:hover{background:var(--rule-soft)}
.line .grow{flex:1;min-width:0}
.line .name{font-size:13.5px}
.line .sub{font-family:var(--mono);font-size:10.5px;color:var(--dim);margin-top:2px}
.line .sub .sep{color:var(--faint)}
.line .sub.bad{color:var(--accent);word-break:break-all}
.line .pnote{font-size:11.5px;color:var(--faint);margin-top:4px;padding-left:8px;border-left:1px solid var(--rule);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.line .chev{font-size:11px;color:var(--dim);flex-shrink:0}
.line button.act{font-family:var(--mono);font-size:11px;color:var(--accent);border:1px solid var(--rule);padding:5px 10px}
.warnbox{border:1px solid var(--accent);color:var(--accent);font-family:var(--mono);font-size:11.5px;line-height:1.7;padding:11px 13px;margin-top:6px}
.login{display:flex;flex-direction:column;align-items:center;justify-content:center;height:100dvh;gap:16px;padding:22px}
.login .logo{font-family:var(--mono);font-size:15px;letter-spacing:.16em;color:var(--accent)}
.login .say{font-family:var(--mono);font-size:11.5px;color:var(--dim);text-align:center;line-height:1.9}
.login .err{font-family:var(--mono);font-size:11.5px;color:var(--accent);text-align:center;max-width:280px}
.toast{
  position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom) + 78px);
  background:var(--bg);border:1px solid var(--accent);color:var(--accent);
  font-family:var(--mono);font-size:11.5px;padding:9px 15px;z-index:60;max-width:90vw;
  animation:fade .2s ease;
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms !important;animation-iteration-count:1 !important;transition-duration:.01ms !important}
}
</style>

function pad2(n) { return n < 10 ? "0" + n : "" + n; }
function fmtD(d) { return d.getFullYear() + "-" + pad2(d.getMonth() + 1) + "-" + pad2(d.getDate()); }
function today() { var n = new Date(); return fmtD(n); }
function parseDay(s) {
  var p = String(s).split("T")[0].split("-");
  return new Date(Number(p[0]), Number(p[1]) - 1, Number(p[2]));
}
function daysLeft(due) {
  if (!due) return null;
  return Math.round((parseDay(due) - parseDay(today())) / 86400000);
}
function dueLabel(due) {
  if (!due) return "—";
  var n = daysLeft(due);
  if (n === 0) return "오늘";
  if (n === 1) return "내일";
  if (n > 0) return "D-" + n;
  return "D+" + Math.abs(n);
}
function uid() { return Math.random().toString(36).slice(2, 9) + Date.now().toString(36).slice(-3); }

function atDay(y, mIdx, day) {
  var base = new Date(y, mIdx, 1);
  var last = new Date(base.getFullYear(), base.getMonth() + 1, 0).getDate();
  return new Date(base.getFullYear(), base.getMonth(), Math.min(day, last));
}

function stepOnce(cur, t) {
  var pat = t.recurrencePattern || {};
  var d = new Date(cur);
  switch (t.recurrence) {
    case "daily":    d.setDate(d.getDate() + 1); return d;
    case "biweekly": d.setDate(d.getDate() + 14); return d;
    case "weekly":
      var wd = pat.weekdays || [];
      for (var i = 1; i <= 7 && wd.length; i++) {
        var c = new Date(cur);

  }

function nextRepeat(t) {
  if (!t.recurrence || t.recurrence === "none" || !t.due) return null;
  var td = today();

  var guard = 0;
  while (next && fmtD(next) <= td && guard < 2000) {
    next = stepOnce(next, t);
    guard++;
  }
  if (!next) return null;
  var s = fmtD(next);
  if (t.recurrenceEndDate && s > t.recurrenceEndDate) return null;
  return s;
}

function getToken() { try { return localStorage.getItem(TOKEN_KEY); } catch (e) { return null; } }
function setToken(t) {
  try { if (t) localStorage.setItem(TOKEN_KEY, t); else localStorage.removeItem(TOKEN_KEY); } catch (e) {}

function cloudGetAll() {
  var token = getToken();
  return fetch(APPS_SCRIPT_URL + "?t=" + Date.now() + "&token=" + encodeURIComponent(token || ""))
    .then(function (res) {
      if (!res.ok) throw new Error("서버 응답 " + res.status);
      return res.json();
    })
    .then(function (data) {

      return data;
    });

function cloudPost(payload) {
  var token = getToken();
  var body = {};
  for (var k in payload) body[k] = payload[k];
  body.token = token;
  return fetch(APPS_SCRIPT_URL, {
    method: "POST",
    headers: { "Content-Type": "text/plain;charset=utf-8" },
    body: JSON.stringify(body)
  }).then(function (res) {
    if (!res.ok) throw new Error("서버 응답 " + res.status);
    return res.json();

}

function isAuthError(e) { return String(e && e.message).indexOf("unauthorized") !== -1; }

var MERGE_KEYS = ["tmv3_tasks", "tmv3_proj"];
var PENDING_KEY = "taskboard_pending_v1";

function emptyPending() { return { tmv3_tasks: { up: {}, rm: {} }, tmv3_proj: { up: {}, rm: {} } }; }
function loadPending() {
  var p = emptyPending();
  try {
    var raw = JSON.parse(localStorage.getItem(PENDING_KEY) || "null");
    MERGE_KEYS.forEach(function (k) {
      if (raw && raw[k] && raw[k].up && raw[k].rm) p[k] = raw[k];
    });
  } catch (e) {}
  return p;
}
function storePending(p) { try { localStorage.setItem(PENDING_KEY, JSON.stringify(p)); } catch (e) {} }
function isEmptyPending(pk) { return !pk || (!Object.keys(pk.up).length && !Object.keys(pk.rm).length); }

function queueDiff(pk, prev, next) {
  var before = {};
  (prev || []).forEach(function (it) { before[it.id] = it; });
  var after = {};
  (next || []).forEach(function (it) {
    after[it.id] = true;
    var b = before[it.id];
    if (!b || JSON.stringify(b) !== JSON.stringify(it)) {
      pk.up[it.id] = it;
      delete pk.rm[it.id];
    }
  });
  Object.keys(before).forEach(function (id) {
    if (after[id]) return;
    pk.rm[id] = true;
    delete pk.up[id];
  });

function rebase(base, pk) {
  var out = [];
  var seen = {};
  (base || []).forEach(function (it) {
    if (!it || !it.id) return;
    seen[it.id] = true;
    if (pk && pk.rm[it.id]) return;
    out.push(pk && pk.up[it.id] ? pk.up[it.id] : it);
  });
  if (pk) Object.keys(pk.up).forEach(function (id) { if (!seen[id]) out.push(pk.up[id]); });
  return out;
}

function parseList(s) {
  try { var v = JSON.parse(s || "[]"); return Array.isArray(v) ? v : []; } catch (e) { return []; }
}

function agoLabel(ms) {
  if (!ms) return "";
  var m = Math.floor((Date.now() - ms) / 60000);
  if (m < 1) return "방금 동기화";
  if (m < 60) return "동기화 " + m + "분 전";
  return "동기화 " + Math.floor(m / 60) + "시간 전";
}

function migrateTask(t) {
  var s = t.status;
  var next = (s === "추후업무" || s === "추후") ? "추후" : "우선";
  var cat = t.category === "LIFE" || t.category === "생활" ? "생활" : "업무";
  return {

function Calendar(props) {
  var tasks = props.tasks;
  var st = useState(function () { var d = new Date(); return { y: d.getFullYear(), m: d.getMonth() }; });
  var ym = st[0], setYm = st[1];
  var st2 = useState(today()); var sel = st2[0], setSel = st2[1];

  var cells = useMemo(function () {
    var first = new Date(ym.y, ym.m, 1);
    var start = new Date(first);
    start.setDate(1 - first.getDay());
    var out = [];
    for (var i = 0; i < 42; i++) {
      var d = new Date(start);
      d.setDate(start.getDate() + i);
      out.push({ ds: fmtD(d), out: d.getMonth() !== ym.m });
    }
    return out;
  }, [ym.y, ym.m]);

  function onDay(ds) {
    return tasks.filter(function (t) {
      if (!t.due) return false;
      var s = t.start && t.start <= t.due ? t.start : t.due;
      return s <= ds && ds <= t.due;
    });
  }

  function move(delta) {
    var m = ym.m + delta, y = ym.y;
    if (m < 0) { m = 11; y--; } else if (m > 11) { m = 0; y++; }
    setYm({ y: y, m: m });
  }

  var selTasks = onDay(sel);

  return html`
    <div>
      <div class="calhd">
        <button onClick=${function () { move(-1); }} aria-label="이전 달">‹</button>
        <span class="ym mono">${ym.y}.${pad2(ym.m + 1)}</span>
        <button onClick=${function () { move(1); }} aria-label="다음 달">›</button>
      </div>
      <div class="dow">${DOW.map(function (d) { return html`<div>${d}</div>`; })}</div>
      <div class="grid">
        ${cells.map(function (c) {
          var list = onDay(c.ds);
          var hot = list.some(function (t) { var n = daysLeft(t.due); return !t.done && n !== null && n <= SOON_DAYS; });
          return html`
            <button class=${"cell" + (c.out ? " out" : "") + (c.ds === today() ? " today" : "")}
                    aria-pressed=${c.ds === sel ? "true" : "false"}
                    onClick=${function () { setSel(c.ds); }}>
              <span class=${"num" + (hot ? " hot" : "")}>${Number(c.ds.slice(8))}</span>
              <span class="dots">
                ${list.slice(0, 3).map(function (t) {
                  return html`<i class=${t.done ? "done" : t.category === "생활" ? "life" : ""}></i>`;
                })}
              </span>
            </button>`;
        })}
      </div>
      <div class="legend">
        <span><i></i>업무</span>
        <span><i class="life"></i>생활</span>
        <span><u>밑줄</u> ${SOON_DAYS}일 안 마감</span>
      </div>
      <div class="daylist">
        <div class="hd mono">${sel} · ${selTasks.length}건</div>
        ${selTasks.length === 0
          ? html`<div class="empty"><b>이 날은 비어 있습니다</b></div>`
          : selTasks.map(function (t) {
              return html`<${Row} key=${t.id} task=${t} projName=${props.projName(t)}
                                  onToggle=${props.onToggle} onOpen=${props.onOpen} />`;
            })}
      </div>
    </div>`;
}

function repeatSay(f) {
  if (!f.due) return "마감일을 정해야 반복이 돕니다.";
  var base = parseDay(f.due);
  var day = f.monthday || base.getDate();
  if (f.recurrence === "daily") return "완료하면 다음 날짜로 넘어갑니다.";
  if (f.recurrence === "weekly") {
    if (!f.weekdays.length) return "요일을 고르지 않으면 이레마다 돌아옵니다.";
    var names = f.weekdays.slice().sort(function (a, b) { return a - b; })
                  .map(function (i) { return DOW[i]; }).join("·");
    return "매주 " + names + "요일에 돌아옵니다.";
  }
  if (f.recurrence === "biweekly") return "두 주마다 " + DOW[base.getDay()] + "요일에 돌아옵니다.";
  if (f.recurrence === "monthly") {
    return "매월 " + day + "일에 돌아옵니다" + (day > 28 ? " (그 날이 없는 달은 말일)" : "") + ".";
  }
  if (f.recurrence === "yearly") {
    return "해마다 " + (base.getMonth() + 1) + "월 " + day + "일에 돌아옵니다.";
  }
  return "";
}

      <div class="sect">계정</div>
      <div class="line">
        <div class="grow"><div class="name">로그아웃</div><div class="sub">이 기기에서만 나갑니다</div></div>
        <button class="act" onClick=${props.onLogout}>나가기</button>
      </div>

      <div class="hintline" style="padding:16px var(--pad) 26px">
        자료는 구글 스프레드시트에 저장됩니다. 연결이 끊긴 동안 고친 것은 이 기기에 남겨 두었다가
        다시 이어지면 올립니다. 두 기기가 같은 할 일을 고치면 나중에 올라간 쪽이 남습니다.
      </div>
    </div>`;
}

function App() {
  var a0 = useState(function () { return !!getToken(); }); var authed = a0[0], setAuthed = a0[1];

  var hydRef = useRef(false);
  var h0 = useState(false); var hydrated = h0[0], setHydrated = h0[1];

  var l0 = useState("loading"); var phase = l0[0], setPhase = l0[1];
  var p0 = useState([]); var projects = p0[0], setProjects = p0[1];
  var t0 = useState([]); var tasks = t0[0], setTasks = t0[1];

  var f0 = useState(FILTERS[0]); var filter = f0[0], setFilter = f0[1];
  var v0 = useState("calendar"); var view = v0[0], setView = v0[1];
  var s0 = useState(null); var sheet = s0[0], setSheet = s0[1];
  var g0 = useState(false); var gcalBusy = g0[0], setGcalBusy = g0[1];
  var e0 = useState(""); var saveErr = e0[0], setSaveErr = e0[1];
  var m0 = useState(null); var toast = m0[0], setToast = m0[1];
  var k0 = useState(false); var linkLost = k0[0], setLinkLost = k0[1];
  var n0 = useState(function () {
    return ("Notification" in window) ? Notification.permission : "unsupported";
  }); var notifyState = n0[0], setNotifyState = n0[1];

  var y0 = useState(0); var lastSync = y0[0], setLastSync = y0[1];
  var w0 = useState(0); var setTick = w0[1];
  var q0 = useState(null); var gcalNote = q0[0], setGcalNote = q0[1];

  var stampRef = useRef({});
  var baseRef = useRef({ tmv3_tasks: [], tmv3_proj: [] });
  var pendingRef = useRef(loadPending());
  var inflightRef = useRef({});
  var notifiedRef = useRef({});

  function say(msg) {
    setToast(msg);
    setTimeout(function () { setToast(null); }, 2600);
  }

  function forceLogout() {
    setToken(null);
    pendingRef.current = emptyPending();
    storePending(pendingRef.current);
    hydRef.current = false;
    setHydrated(false);
    setAuthed(false);
    setPhase("loading");
    setProjects([]); setTasks([]);
  }

  function push(key, next, prev) {
    if (!hydRef.current) return;
    queueDiff(pendingRef.current[key], prev, next);
    storePending(pendingRef.current);
    flushPending();
  }
  function saveTasks(next, prev) { push("tmv3_tasks", next, prev); }
  function saveProjects(next, prev) { push("tmv3_proj", next, prev); }

  function settle(key) {
    var list = rebase(baseRef.current[key], pendingRef.current[key]);
    if (key === "tmv3_tasks") setTasks(list.map(migrateTask));
    else setProjects(list.map(migrateProj));
  }

  function flushPending() {
    if (!hydRef.current) return;
    MERGE_KEYS.forEach(function (key) {
      var pk = pendingRef.current[key];
      if (inflightRef.current[key] || isEmptyPending(pk)) return;
      var sentUp = {}; for (var id in pk.up) sentUp[id] = JSON.stringify(pk.up[id]);
      var sentRm = Object.keys(pk.rm);
      var upsert = Object.keys(pk.up).map(function (k) { return pk.up[k]; });
      inflightRef.current[key] = true;
      cloudPost({ action: "merge", key: key, upsert: upsert, remove: sentRm })
        .then(function (r) {
          inflightRef.current[key] = false;
          if (!r.ok) throw new Error(r.error || "저장하지 못했습니다");
          var cur = pendingRef.current[key];
          for (var sid in sentUp) if (cur.up[sid] && JSON.stringify(cur.up[sid]) === sentUp[sid]) delete cur.up[sid];
          sentRm.forEach(function (rid) { delete cur.rm[rid]; });
          storePending(pendingRef.current);
          baseRef.current[key] = parseList(r.value);
          stampRef.current[key] = r.updatedAt;
          settle(key);
          setSaveErr("");
          setLastSync(Date.now());
          if (!isEmptyPending(cur)) flushPending();
        })
        .catch(function (e) {
          inflightRef.current[key] = false;
          if (isAuthError(e)) { forceLogout(); return; }
          setSaveErr(e && e.message === "busy"
            ? "서버가 바빠서 저장을 미뤘습니다. 곧 다시 올립니다."
            : "저장하지 못했습니다. 이 기기에 남겨 두었다가 연결되면 올립니다.");
        });
    });
  }

  function adopt(all) {
    MERGE_KEYS.forEach(function (key) {
      var cell = all[key];
      var changed = !hydRef.current || (cell && cell.updatedAt && cell.updatedAt !== stampRef.current[key]);
      if (!changed) return;
      baseRef.current[key] = cell && cell.value ? parseList(cell.value) : [];
      stampRef.current[key] = cell ? cell.updatedAt : null;
      settle(key);
    });
    hydRef.current = true;
    setHydrated(true);
    setPhase("ready");
    setLinkLost(false);
    setLastSync(Date.now());
  }

  function load() {
    if (!hydRef.current) setPhase("loading");
    return cloudGetAll()
      .then(function (all) {
        adopt(all);
        flushPending();
      })
      .catch(function (e) {
        if (isAuthError(e)) { forceLogout(); return; }
        if (hydRef.current) setLinkLost(true); else setPhase("offline");
      });
  }

  useEffect(function () {
    if (!authed) return;
    load();
  }, [authed]);

  useEffect(function () {
    if (!authed) return;
    var iv = setInterval(function () {
      if (document.visibilityState === "hidden") return;
      load();
    }, SYNC_MS);
    function onVisible() { if (document.visibilityState === "visible") load(); }
    function onOnline() { load(); }
    document.addEventListener("visibilitychange", onVisible);
    window.addEventListener("online", onOnline);
    var tick = setInterval(function () { setTick(Date.now()); }, 30000);
    return function () {
      clearInterval(iv); clearInterval(tick);
      document.removeEventListener("visibilitychange", onVisible);
      window.removeEventListener("online", onOnline);
    };
  }, [authed]);

  useEffect(function () {
    if (phase !== "ready") return;
    function check() {
      var td = today();
      tasks.forEach(function (t) {
        if (t.done || !t.due) return;
        var n = daysLeft(t.due);
        if (n === null || n < 0 || n > SOON_DAYS) return;
        var key = t.id + "_" + n + "_" + td;
        if (notifiedRef.current[key]) return;
        notifiedRef.current[key] = true;
        if ("Notification" in window && Notification.permission === "granted") {
          try {
            new Notification("taskboard", { body: (n === 0 ? "오늘 마감 · " : "D-" + n + " · ") + t.title });
          } catch (e) {}
        }
      });
    }
    check();
    var iv = setInterval(check, 60000);
    return function () { clearInterval(iv); };
  }, [phase, tasks]);

  var PM = useMemo(function () {
    var m = {};
    projects.forEach(function (p) { m[p.id] = p; });
    return m;
  }, [projects]);

  function projName(t) { return PM[t.pid] ? PM[t.pid].name : ""; }

  function toggleDone(id) {
    var moved = null;
    setTasks(function (prev) {
      var next = prev.map(function (t) {
        if (t.id !== id) return t;
        if (!t.done) {
          var nd = nextRepeat(t);
          if (nd) {
            var c = {}; for (var k in t) c[k] = t[k];
            if (t.start && t.start <= t.due) {
              var span = Math.round((parseDay(t.due) - parseDay(t.start)) / 86400000);
              var ns = parseDay(nd);
              ns.setDate(ns.getDate() - span);
              c.start = fmtD(ns);
            }
            c.due = nd; c.done = false;
            moved = nd;
            return c;
          }
          if (t.recurrence && t.recurrence !== "none") moved = "end";
        }
        var c2 = {}; for (var k2 in t) c2[k2] = t[k2];
        c2.done = !t.done;
        return c2;
      });
      saveTasks(next, prev);
      return next;
    });
    if (moved === "end") say("반복이 끝났습니다 — 완료로 넘겼습니다");
    else if (moved) say("다음은 " + moved + " (" + DOW[parseDay(moved).getDay()] + ")");
  }

  function saveTask(form) {
    var pid = form.pid;
    var madeProj = null;

    if (form.newProj) {
      madeProj = { id: uid(), name: form.newProj, category: form.category, catSet: true, start: "", deadline: "", note: "" };
      pid = madeProj.id;
      setProjects(function (prev) {
        var next = prev.concat([madeProj]);
        saveProjects(next, prev);
        return next;
      });
    }

    setTasks(function (prev) {
      var next;
      if (form.id) {
        next = prev.map(function (t) {
          if (t.id !== form.id) return t;
          var c = {}; for (var k in t) c[k] = t[k];
          c.title = form.title; c.note = form.note;
          c.status = form.status; c.category = form.category;
          c.pid = pid; c.start = form.start; c.due = form.due;
          c.recurrence = form.recurrence; c.recurrencePattern = form.recurrencePattern;
          c.recurrenceEndDate = form.recurrenceEndDate;
          return c;
        });
      } else {
        next = prev.concat([{
          id: uid(), pid: pid, title: form.title, note: form.note,
          status: form.status, category: form.category,
          start: form.start, due: form.due, done: false,
          recurrence: form.recurrence, recurrencePattern: form.recurrencePattern,
          recurrenceEndDate: form.recurrenceEndDate, created: Date.now()
        }]);
      }
      saveTasks(next, prev);
      return next;
    });

    setSheet(null);
    say(form.id ? "고쳤습니다" : "추가했습니다");
  }

  function deleteTask(id) {
    setTasks(function (prev) {
      var next = prev.filter(function (t) { return t.id !== id; });
      saveTasks(next, prev);
      return next;
    });
    setSheet(null);
    say("지웠습니다");
  }

  function saveProj(form) {
    setProjects(function (prev) {
      var next;
      if (form.id) {
        next = prev.map(function (p) {
          if (p.id !== form.id) return p;
          var c = {}; for (var k in p) c[k] = p[k];
          c.name = form.name; c.start = form.start; c.deadline = form.deadline; c.note = form.note;
          c.category = form.category; c.catSet = true;
          return c;
        });
      } else {
        next = prev.concat([{
          id: uid(), name: form.name, category: form.category || "업무", catSet: true,
          start: form.start, deadline: form.deadline, note: form.note
        }]);
      }
      saveProjects(next, prev);
      return next;
    });
    setSheet(null);
    say(form.id ? "고쳤습니다" : "\"" + form.name + "\" 프로젝트를 만들었습니다");
  }

  function deleteProj(id) {
    setProjects(function (prev) {
      var next = prev.filter(function (p) { return p.id !== id; });
      saveProjects(next, prev);
      return next;
    });
    setTasks(function (prev) {
      var next = prev.map(function (t) {
        if (t.pid !== id) return t;
        var c = {}; for (var k in t) c[k] = t[k];
        c.pid = "";
        return c;
      });
      saveTasks(next, prev);
      return next;
    });
    setSheet(null);
    say("프로젝트를 지웠습니다 — 할 일은 남습니다");
  }

  function sendGcal() {
    if (!hydRef.current) { say("연결된 뒤에 보낼 수 있습니다"); return; }
    setGcalBusy(true);
    var payload = tasks.map(function (t) {
      return {
        id: t.id, title: t.title, start: t.start, due: t.due, done: t.done,
        category: t.category === "생활" ? "LIFE" : "WORK",
        project: projName(t)
      };
    });
    cloudPost({ action: "gcalSync", tasks: payload })
      .then(function (r) {
        setGcalBusy(false);
        if (r.error === "unauthorized") { forceLogout(); return; }
        if (r.error === "gcal_busy") { note("이미 보내는 중입니다. 잠시 뒤에 다시 누르세요.", true); return; }
        if (r.error === "busy") { note("서버가 바쁩니다. 잠시 뒤에 다시 누르세요.", true); return; }
        if (r.created === undefined) { note("보내지 못했습니다. " + (r.error || ""), true); return; }

        var parts = ["새로 " + r.created, "고침 " + r.updated, "정리 " + r.removed];
        if (r.unchanged) parts.push("그대로 " + r.unchanged);
        var msg = "캘린더로 보냈습니다. " + parts.join(" · ");
        if (r.left) msg += ". 남은 " + r.left + "건은 한 번 더 누르면 보냅니다";
        if (r.failed) msg += ". " + r.failed + "건 실패: " + r.error;
        note(msg, !!r.failed);
      })
      .catch(function (e) {
        setGcalBusy(false);
        if (isAuthError(e)) { forceLogout(); return; }
        note("보내지 못했습니다. 연결을 확인하세요. (" + (e && e.message || "") + ")", true);
      });

    function note(text, bad) {
      setGcalNote({ text: text, bad: bad });
      say(bad ? "캘린더로 보내지 못한 것이 있습니다" : "캘린더로 보냈습니다");
    }
  }

  var visible = useMemo(function () {
    var out = tasks.filter(function (t) {
      if (filter === "진행중") return !t.done;
      if (filter === "기한임박") {
        if (t.done || !t.due) return false;
        var n = daysLeft(t.due);
        return n !== null && n <= SOON_DAYS;
      }
      return true;
    });
    return out.sort(function (a, b) {
      if (a.done !== b.done) return a.done ? 1 : -1;
      if (a.status !== b.status) return a.status === "우선" ? -1 : 1;
      var ad = a.due || "9999-12-31", bd = b.due || "9999-12-31";
      if (ad !== bd) return ad < bd ? -1 : 1;
      return b.created - a.created;
    });
  }, [tasks, filter]);

  var counts = useMemo(function () {
    var open = tasks.filter(function (t) { return !t.done; });
    var soon = open.filter(function (t) {
      if (!t.due) return false;
      var n = daysLeft(t.due);
      return n !== null && n <= SOON_DAYS;
    });
    return { open: open.length, soon: soon.length };
  }, [tasks]);

  if (!authed) return html`<${Login} onIn=${function () { setAuthed(true); }} />`;

  var now = new Date();
  var cmdText = view === "config" ? "config"
              : view === "calendar" ? "calendar"
              : filter === "진행중" ? "tasks --active"
              : filter === "기한임박" ? "tasks --due " + SOON_DAYS + "d"
              : "tasks --all";

  return html`
    <div id="app">
      <div class="top">
        <span class="brand">taskboard${phase === "ready" && lastSync ? html`<span class="sync">${agoLabel(lastSync)}</span>` : null}</span>
        <span class="today mono">${fmtD(now)} ${DOW[now.getDay()]}</span>
      </div>

      <div class="cmd">${">"} <b>${cmdText}</b>${phase === "ready" ? html`<span> — ${
        view === "config"
          ? "프로젝트 " + projects.length + " · 할 일 " + tasks.length
          : counts.open + "건 진행중 · " + counts.soon + "건 " + SOON_DAYS + "일 안"
      }</span>` : null}<span class="caret"></span></div>

      ${phase === "offline" ? html`
        <div class="banner warn">
          <span>연결 없음 — 자료를 불러오지 못했습니다</span>
          <button onClick=${load}>다시</button>
        </div>` : null}

      ${phase === "ready" && linkLost ? html`
        <div class="banner warn">
          <span>연결이 끊겼습니다 — 화면은 마지막으로 받은 자료입니다</span>
          <button onClick=${load}>다시</button>
        </div>` : null}

      ${saveErr ? html`<div class="banner warn"><span>${saveErr}</span></div>` : null}

      ${view === "tasks" && phase === "ready" ? html`
        <div class="tabsel">
          ${FILTERS.map(function (f) {
            return html`<button aria-pressed=${filter === f ? "true" : "false"}
                                onClick=${function () { setFilter(f); }}>${f}</button>`;
          })}
        </div>` : null}

      <div class="scroll">
        ${phase === "loading" ? html`<div class="empty mono"><b>불러오는 중…</b></div>` : null}

        ${phase === "offline" ? html`
          <div class="empty">
            <b>화면에 아무것도 채우지 않았습니다</b>
            없는 자료를 지어내면 그것이 원본을 덮습니다.<br />
            연결이 돌아오면 30초 안에 스스로 이어집니다.
          </div>` : null}

        ${phase === "ready" && view === "tasks" ? (
          visible.length === 0
            ? html`<div class="empty">
                     <b>${filter === "전체" ? "아직 할 일이 없습니다" : "여기는 비었습니다"}</b>
                     오른쪽 아래 ＋ 로 하나 만들어 보세요
                   </div>`
            : visible.map(function (t) {
                return html`<${Row} key=${t.id} task=${t} projName=${projName(t)}
                                    onToggle=${toggleDone}
                                    onOpen=${function (task) { setSheet({ task: task }); }} />`;
              })
        ) : null}

        ${phase === "ready" && view === "calendar" ? html`
          <${Calendar} tasks=${tasks} projName=${projName} onToggle=${toggleDone}
                       onOpen=${function (task) { setSheet({ task: task }); }} />` : null}

        ${phase === "ready" && view === "config" ? html`
          <${ConfigView} projects=${projects} tasks=${tasks}
                         gcalBusy=${gcalBusy} onGcal=${sendGcal} gcalNote=${gcalNote}
                         notifyState=${notifyState}
                         onNewProj=${function () { setSheet({ proj: null, newProj: true }); }}
                         onEditProj=${function (p) { setSheet({ proj: p }); }}
                         onAskNotify=${function () {
                           if (!("Notification" in window)) return;
                           try {
                             Notification.requestPermission().then(function (p) { setNotifyState(p); });
                           } catch (e) {
                             Notification.requestPermission(function (p) { setNotifyState(p); });
                           }
                         }}
                         onLogout=${function () {
                           cloudPost({ action: "logout" }).catch(function () {});
                           forceLogout();
                         }} />` : null}
      </div>

      ${phase === "ready" && view !== "config" ? html`
        <button class="fab" onClick=${function () { setSheet({}); }} aria-label="새로 만들기">＋</button>` : null}

      <div class="tabs">
        <button aria-current=${view === "tasks" ? "page" : null} onClick=${function () { setView("tasks"); }}>tasks</button>
        <button aria-current=${view === "calendar" ? "page" : null} onClick=${function () { setView("calendar"); }}>calendar</button>
        <button aria-current=${view === "config" ? "page" : null} onClick=${function () { setView("config"); }}>config</button>
      </div>

      ${toast ? html`<div class="toast">${toast}</div>` : null}

      ${sheet ? html`
        <${AddSheet} task=${sheet.task || null} proj=${sheet.proj || null}
                     initMode=${sheet.newProj ? "proj" : "task"}
                     projects=${projects}
                     taskCount=${sheet.proj ? tasks.filter(function (t) { return t.pid === sheet.proj.id; }).length : 0}
                     onSaveTask=${saveTask} onDeleteTask=${deleteTask}
                     onSaveProj=${saveProj} onDeleteProj=${deleteProj}
                     onClose=${function () { setSheet(null); }} />` : null}

    </div>`;
}

render(html`<${App} />`, document.getElementById("root"));

if ("serviceWorker" in navigator) {
  window.addEventListener("load", function () {
    navigator.serviceWorker.register("sw.js").catch(function () {});
  });
}
})();

</script>
</body>
</html>
