<!--
  taskboard — 개인 할 일 관리 (SYS-217, 2026-08-26 전면 개편)

  ■ 이 파일 하나가 앱 전체다. 빌드 단계가 없다.
    수정 → GitHub에 이 파일 업로드 → 끝. (sw.js의 CACHE 상수도 함께 올릴 것)

  ■ 라이브러리는 같은 폴더의 vendor-preact.js 하나뿐이다(preact+hooks+htm 13KB).
    CDN에서 받아오지 않으므로 unpkg가 죽어도 앱은 산다.
    외부 의존은 구글 로그인(GSI) 하나뿐이며 이것만은 자체 호스팅이 불가능하다.

  ■ 데이터 안전 원칙 (SYS-217의 존재 이유)
    1) 서버에서 데이터를 한 번이라도 받기 전에는 hydrated=false이고,
       그동안 saveXXX()는 전부 즉시 반환한다 — 어떤 조작도 서버로 나가지 않는다.
    2) 로드 실패 시 화면에 견본/기본 데이터를 채우지 않는다. 「연결 없음」을 띄운다.
       (2026-08-25 사고: 실패 폴백이 개발용 견본이었고 그것이 원본을 덮었다)
    3) 저장 실패는 삼키지 않는다. 화면에 남기고 연결 복구 시 재전송한다.
-->

<script src="vendor-preact.js"></script>

<style>
:root{
  color-scheme:dark;          /* 날짜 입력기·선택 목록도 어두운 판으로 그려진다 */
  --bg:#000000;
  --fg:#d6d6d6;
  --dim:#6a6a6a;
  --faint:#4a4a4a;
  --accent:#FFB000;
  --rule:#1e1e1e;
  --rule-soft:#141414;
  --out:#242424;
  --sans:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif;
  --mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,"Liberation Mono",monospace;
  --pad:14px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{
  margin:0;background:var(--bg);color:var(--fg);
  font-family:var(--sans);font-size:14px;line-height:1.5;
  -webkit-font-smoothing:antialiased;
  overscroll-behavior-y:none;
}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
input,select,textarea{font:inherit;color:inherit;background:var(--bg);border:1px solid var(--rule);padding:9px 10px;width:100%;border-radius:0}
input:focus,select:focus,textarea:focus{outline:1px solid var(--accent);outline-offset:-1px;border-color:var(--accent)}
:focus-visible{outline:1px solid var(--accent);outline-offset:1px}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}

/* ── 셸 ── */
#app{display:flex;flex-direction:column;height:100dvh;max-width:640px;margin:0 auto;position:relative}
.scroll{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch}

.top{display:flex;align-items:baseline;justify-content:space-between;padding:calc(env(safe-area-inset-top) + 13px) var(--pad) 7px;flex-shrink:0}
.brand{font-family:var(--mono);font-size:12.5px;letter-spacing:.06em;color:var(--dim)}
.today{font-family:var(--mono);font-size:11.5px;letter-spacing:.05em;color:var(--dim)}

.cmd{padding:0 var(--pad) 11px;font-family:var(--mono);font-size:12px;color:var(--dim);flex-shrink:0}
.cmd b{color:var(--accent);font-weight:500}
.caret{display:inline-block;width:7px;height:12px;background:var(--accent);vertical-align:-2px;margin-left:3px;animation:blink 1.06s step-end infinite}
@keyframes blink{0%,49%{opacity:1}50%,100%{opacity:0}}

.tabsel{display:flex;padding:0 var(--pad) 11px;flex-shrink:0;border-bottom:1px solid var(--rule)}
.tabsel button{
  font-family:var(--mono);font-size:11.5px;letter-spacing:.02em;color:var(--dim);
  padding:3px 10px;border:1px solid var(--rule);margin-right:-1px;transition:color .16s,background .16s,border-color .16s;
}
.tabsel button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:#000;font-weight:600}

/* ── 목록 ── */
.row{display:grid;grid-template-columns:28px 1fr auto;gap:9px;padding:11px var(--pad);border-bottom:1px solid var(--rule-soft);align-items:baseline;animation:rowin .26s ease both}
@keyframes rowin{from{opacity:0;transform:translateX(-7px)}to{opacity:1;transform:none}}
.row .box{font-family:var(--mono);font-size:13px;color:var(--dim);text-align:left;transition:color .18s;line-height:1.45}
.row .box:hover{color:var(--accent)}
.row.done .box{color:var(--accent)}
.row .body{min-width:0}
.row .ttl{font-size:13.5px;line-height:1.4;word-break:break-word;transition:color .2s,opacity .2s}
.row.done .ttl{color:var(--faint);text-decoration:line-through}
.row .meta{font-family:var(--mono);font-size:10.5px;color:var(--dim);margin-top:3px;letter-spacing:.02em}
.row .meta .sep{color:var(--faint);margin:0 5px}
.row .note{
  font-size:11.5px;color:var(--faint);margin-top:5px;line-height:1.45;
  padding-left:8px;border-left:1px solid var(--rule);
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
}
.row.done .note{opacity:.5}
.row .d{font-family:var(--mono);font-size:11px;color:var(--dim);font-variant-numeric:tabular-nums;white-space:nowrap}
.row .d.hot{color:var(--accent)}
.row .d.over{color:var(--accent);font-weight:600}
.row .body[role="button"]{cursor:pointer}

.empty{padding:44px var(--pad);text-align:center;color:var(--faint);font-family:var(--mono);font-size:12px;line-height:1.9}
.empty b{display:block;color:var(--dim);font-weight:400;margin-bottom:6px}

/* ── 하단 탭 ── */
.tabs{display:flex;border-top:1px solid var(--rule);flex-shrink:0;padding-bottom:env(safe-area-inset-bottom)}
.tabs button{flex:1;padding:12px 0;font-family:var(--mono);font-size:11px;letter-spacing:.08em;color:var(--dim);border-right:1px solid var(--rule)}
.tabs button:last-child{border-right:0}
.tabs button[aria-current="page"]{color:var(--accent)}

.fab{
  position:absolute;right:16px;bottom:calc(env(safe-area-inset-bottom) + 62px);
  width:46px;height:46px;border:1px solid var(--accent);color:var(--accent);background:var(--bg);
  font-size:21px;line-height:1;display:flex;align-items:center;justify-content:center;
  transition:background .18s,color .18s;z-index:5;
}
.fab:hover{background:var(--accent);color:#000}

/* ── 상태 배너 ── */
.banner{
  font-family:var(--mono);font-size:11px;padding:8px var(--pad);flex-shrink:0;
  border-bottom:1px solid var(--rule);display:flex;gap:9px;align-items:center;
}
.banner.warn{color:var(--accent)}
.banner button{font-family:var(--mono);font-size:11px;color:var(--accent);text-decoration:underline;margin-left:auto}

/* ── 입력 화면 ──
   하단 시트가 아니라 온전한 한 화면이다. 시트로 띄우면 위쪽이 빈 채로 남고,
   그 빈 자리가 아래 탭 막대까지 덮어 눌러도 반응하지 않았다. */
.sheet{position:fixed;inset:0;background:var(--bg);z-index:50;display:flex;align-items:stretch;justify-content:center;animation:fade .18s ease}
@keyframes fade{from{opacity:0}to{opacity:1}}
.sheet-in{
  width:100%;max-width:640px;height:100dvh;overflow-y:auto;background:var(--bg);
  padding:0 var(--pad) calc(env(safe-area-inset-bottom) + 24px);
  animation:slideup .26s cubic-bezier(.22,1,.36,1);
}
@keyframes slideup{from{transform:translateY(14px);opacity:.4}to{transform:none;opacity:1}}
.sheet-hd{
  display:flex;align-items:baseline;justify-content:space-between;
  position:sticky;top:0;z-index:2;background:var(--bg);
  padding:calc(env(safe-area-inset-top) + 15px) 0 11px;margin-bottom:14px;
  border-bottom:1px solid var(--rule);
}
.sheet-hd h2{margin:0;font-family:var(--mono);font-size:12.5px;font-weight:500;letter-spacing:.06em;color:var(--accent)}
.sheet-hd button{font-family:var(--mono);font-size:11.5px;color:var(--dim)}

/* 무엇을 만들지 먼저 고른다 */
.seg{display:flex;margin-bottom:17px}
.seg button{
  flex:1;font-family:var(--mono);font-size:12px;padding:9px 0;
  border:1px solid var(--rule);color:var(--dim);margin-right:-1px;
  transition:background .16s,color .16s,border-color .16s;
}
.seg button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:#000;font-weight:600}
.field{margin-bottom:13px}
.field label{display:block;font-family:var(--mono);font-size:10.5px;letter-spacing:.09em;color:var(--dim);margin-bottom:5px}
.pick{display:flex;flex-wrap:wrap;gap:0}
.pick button{
  font-family:var(--mono);font-size:11.5px;padding:7px 13px;border:1px solid var(--rule);
  color:var(--dim);margin-right:-1px;margin-bottom:-1px;transition:background .16s,color .16s,border-color .16s;
}
/* 고른 것은 테두리와 글자로만 말한다 — 앰버 채움은 화면에 하나(필터 탭)만 둔다.
   한 화면에 채움이 여럿이면 무엇이 중요한지가 흩어진다. */
.pick button[aria-pressed="true"]{border-color:var(--accent);color:var(--accent);font-weight:600;position:relative;z-index:1}
.duo{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.actions{display:flex;gap:9px;margin-top:17px}
.actions button{flex:1;padding:12px 0;border:1px solid var(--rule);font-family:var(--mono);font-size:12px;color:var(--dim);transition:background .16s,color .16s,border-color .16s}
.actions button.go{border-color:var(--accent);color:var(--accent)}
.actions button.go:hover{background:var(--accent);color:#000}
.actions button.danger{color:var(--accent)}
.hintline{font-family:var(--mono);font-size:10.5px;color:var(--faint);margin-top:8px;line-height:1.7}

/* ── 달력 ── */
.calhd{display:flex;align-items:center;justify-content:space-between;padding:12px var(--pad) 10px}
.calhd .ym{font-family:var(--mono);font-size:14px;letter-spacing:.03em}
.calhd button{font-family:var(--mono);font-size:15px;color:var(--dim);padding:2px 11px;border:1px solid var(--rule)}
.dow,.grid{display:grid;grid-template-columns:repeat(7,1fr)}
.dow div{text-align:center;font-family:var(--mono);font-size:10px;color:var(--faint);padding:5px 0;letter-spacing:.04em}
.grid{border-top:1px solid var(--rule)}
.cell{
  aspect-ratio:1/1;border-right:1px solid var(--rule-soft);border-bottom:1px solid var(--rule-soft);
  display:flex;flex-direction:column;align-items:center;justify-content:flex-start;gap:3px;padding-top:6px;
  font-family:var(--mono);font-size:11.5px;color:var(--dim);transition:background .16s;
}
.cell:nth-child(7n){border-right:0}
.cell.out{color:var(--out)}
.cell.today{color:var(--accent)}
.cell[aria-pressed="true"]{background:var(--rule)}
.cell .dots{display:flex;gap:2px;height:4px}
.cell .dots i{width:4px;height:4px;background:var(--dim);display:block}
.cell .dots i.hot{background:var(--accent)}
.daylist{border-top:1px solid var(--rule);padding-top:4px}
.daylist .hd{font-family:var(--mono);font-size:11px;color:var(--dim);padding:9px var(--pad) 4px;letter-spacing:.04em}

/* ── 설정 ── */
.sect{padding:16px var(--pad) 6px;font-family:var(--mono);font-size:10.5px;letter-spacing:.11em;color:var(--faint)}
.sect-row{display:flex;align-items:center;justify-content:space-between;padding:16px var(--pad) 8px;border-bottom:1px solid var(--rule)}
.sect-row .sect{padding:0}
.mini{font-family:var(--mono);font-size:11.5px;color:var(--accent);border:1px solid var(--accent);padding:6px 12px;transition:background .16s,color .16s}
.mini:hover{background:var(--accent);color:#000}
.line{display:flex;align-items:center;gap:10px;padding:12px var(--pad);border-bottom:1px solid var(--rule-soft)}
.line[role="button"]{cursor:pointer;transition:background .16s}
.line[role="button"]:hover{background:var(--rule-soft)}
.line .grow{flex:1;min-width:0}
.line .name{font-size:13.5px}
.line .sub{font-family:var(--mono);font-size:10.5px;color:var(--dim);margin-top:2px}
.line .sub .sep{color:var(--faint)}
.line .pnote{font-size:11.5px;color:var(--faint);margin-top:4px;padding-left:8px;border-left:1px solid var(--rule);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.line .chev{font-size:11px;color:var(--dim);flex-shrink:0}
.line button.act{font-family:var(--mono);font-size:11px;color:var(--accent);border:1px solid var(--rule);padding:5px 10px}
.warnbox{border:1px solid var(--accent);color:var(--accent);font-family:var(--mono);font-size:11.5px;line-height:1.7;padding:11px 13px;margin-top:6px}

/* ── 로그인 ── */
.login{display:flex;flex-direction:column;align-items:center;justify-content:center;height:100dvh;gap:16px;padding:22px}
.login .logo{font-family:var(--mono);font-size:15px;letter-spacing:.16em;color:var(--accent)}
.login .say{font-family:var(--mono);font-size:11.5px;color:var(--dim);text-align:center;line-height:1.9}
.login .err{font-family:var(--mono);font-size:11.5px;color:var(--accent);text-align:center;max-width:280px}

.toast{
  position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom) + 78px);
  background:var(--bg);border:1px solid var(--accent);color:var(--accent);
  font-family:var(--mono);font-size:11.5px;padding:9px 15px;z-index:60;max-width:90vw;
  animation:fade .2s ease;
}

@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms !important;animation-iteration-count:1 !important;transition-duration:.01ms !important}
}
</style>

var SOON_DAYS = 3;            // 「기한임박」 기준 — 사용자 확정값(SYS-217)
var TOKEN_KEY = "taskboard_session_token";

var STATUS = ["우선", "추후"];          // 등록 시 분류 (기본값은 첫 항목)
var CATS = ["업무", "생활"];
var FILTERS = ["진행중", "기한임박", "전체"];
var REPEATS = [
  { v: "none", l: "없음" }, { v: "daily", l: "매일" }, { v: "weekly", l: "매주" },
  { v: "biweekly", l: "격주" }, { v: "monthly", l: "매월" }, { v: "yearly", l: "매년" }
];
var DOW = ["일", "월", "화", "수", "목", "금", "토"];

// ══════════════════════════════════════════════════════════════
// 날짜 헬퍼
// ══════════════════════════════════════════════════════════════
function pad2(n) { return n < 10 ? "0" + n : "" + n; }
function fmtD(d) { return d.getFullYear() + "-" + pad2(d.getMonth() + 1) + "-" + pad2(d.getDate()); }
function today() { var n = new Date(); return fmtD(n); }
function parseDay(s) {
  var p = String(s).split("T")[0].split("-");
  return new Date(Number(p[0]), Number(p[1]) - 1, Number(p[2]));
}
// 남은 날수 — 오늘 0, 지났으면 음수
function daysLeft(due) {
  if (!due) return null;
  return Math.round((parseDay(due) - parseDay(today())) / 86400000);
}
function dueLabel(due) {
  if (!due) return "—";
  var n = daysLeft(due);
  if (n === 0) return "오늘";
  if (n === 1) return "내일";
  if (n > 0) return "D-" + n;
  return "D+" + Math.abs(n);
}
function uid() { return Math.random().toString(36).slice(2, 9) + Date.now().toString(36).slice(-3); }

// ══════════════════════════════════════════════════════════════
// 반복 일정
//
// 여기는 함정이 많은 자리라 규칙을 먼저 적어 둔다.
//   ① 그 달에 없는 날짜는 말일로 당긴다. 1월 31일의 다음 달은 2월 28일이지 3월 31일이 아니다.
//      종전 구현은 setMonth(+1) 뒤 setDate(31)을 불러 2월을 통째로 건너뛰었다 — 매월이 격월이 됐다.
//   ② 기준 날짜(며칠·몇 월며칠)는 recurrencePattern에 붙들어 둔다. 그래야 2월에 28일로 당겨져도
//      3월에 다시 31일로 돌아온다.
//   ③ 다음 회차는 「오늘을 지날 때까지」 나아간다. 며칠 앱을 안 열어 마감이 밀렸을 때
//      한 번 눌러 하루만 가면 여전히 지난 날짜다(8일 방치 시 여덟 번을 눌러야 했다).
// ══════════════════════════════════════════════════════════════

// 그 달에 없는 날은 말일로 당긴다. mIdx가 12여도 다음 해 1월로 알아서 정규화된다.
function atDay(y, mIdx, day) {
  var base = new Date(y, mIdx, 1);
  var last = new Date(base.getFullYear(), base.getMonth() + 1, 0).getDate();
  return new Date(base.getFullYear(), base.getMonth(), Math.min(day, last));
}

// 한 회차만 앞으로
function stepOnce(cur, t) {
  var pat = t.recurrencePattern || {};
  var d = new Date(cur);
  switch (t.recurrence) {
    case "daily":    d.setDate(d.getDate() + 1); return d;
    case "biweekly": d.setDate(d.getDate() + 14); return d;
    case "weekly":
      var wd = pat.weekdays || [];
      for (var i = 1; i <= 7 && wd.length; i++) {
        var c = new Date(cur);
        c.setDate(c.getDate() + i);
        if (wd.indexOf(c.getDay()) !== -1) return c;
      }
      d.setDate(d.getDate() + 7); return d;      // 요일을 안 골랐으면 그냥 한 주 뒤
    case "monthly":  return atDay(cur.getFullYear(), cur.getMonth() + 1, pat.monthday || cur.getDate());
    case "yearly":   return atDay(cur.getFullYear() + 1, cur.getMonth(), pat.monthday || cur.getDate());
    default: return null;
  }
}

function nextRepeat(t) {
  if (!t.recurrence || t.recurrence === "none" || !t.due) return null;
  var td = today();
  var next = stepOnce(parseDay(t.due), t);
  var guard = 0;
  while (next && fmtD(next) <= td && guard < 2000) {   // 오늘을 지날 때까지 따라잡는다
    next = stepOnce(next, t);
    guard++;
  }
  if (!next) return null;
  var s = fmtD(next);
  if (t.recurrenceEndDate && s > t.recurrenceEndDate) return null;   // 반복 종료일을 넘으면 여기서 끝
  return s;
}

// ══════════════════════════════════════════════════════════════
// 통신
// ══════════════════════════════════════════════════════════════
function getToken() { try { return localStorage.getItem(TOKEN_KEY); } catch (e) { return null; } }
function setToken(t) {
  try { if (t) localStorage.setItem(TOKEN_KEY, t); else localStorage.removeItem(TOKEN_KEY); } catch (e) {}
}

function cloudGetAll() {
  var token = getToken();
  return fetch(APPS_SCRIPT_URL + "?t=" + Date.now() + "&token=" + encodeURIComponent(token || ""))
    .then(function (res) {
      if (!res.ok) throw new Error("서버 응답 " + res.status);
      return res.json();
    })
    .then(function (data) {
      if (data && data.ok === false) throw new Error(data.error || "unauthorized");
      return data;
    });
}

function cloudPost(payload) {
  var token = getToken();
  // Content-Type을 text/plain으로 두는 이유: Apps Script는 CORS preflight(OPTIONS)를
  // 처리하지 않으므로 simple request로 보내야 브라우저가 막지 않는다.
  var body = {};
  for (var k in payload) body[k] = payload[k];
  body.token = token;
  return fetch(APPS_SCRIPT_URL, {
    method: "POST",
    headers: { "Content-Type": "text/plain;charset=utf-8" },
    body: JSON.stringify(body)
  }).then(function (res) {
    if (!res.ok) throw new Error("서버 응답 " + res.status);
    return res.json();
  });
}

function isAuthError(e) { return String(e && e.message).indexOf("unauthorized") !== -1; }

// 기존 데이터 이관 — 구 상태 4종 → 신 2종
// ══════════════════════════════════════════════════════════════
function migrateTask(t) {
  var s = t.status;
  var next = (s === "추후업무" || s === "추후") ? "추후" : "우선";
  var cat = t.category === "LIFE" || t.category === "생활" ? "생활" : "업무";
  return {
    id: t.id || uid(),
    pid: t.pid || "",
    title: t.title || "",
    note: t.note || "",
    status: next,
    category: cat,
    start: t.start || "",
    due: t.due || "",
    done: !!t.done,
    recurrence: t.recurrence || "none",
    recurrencePattern: t.recurrencePattern || {},
    recurrenceEndDate: t.recurrenceEndDate || "",
    created: t.created || Date.now()
  };
}
function migrateProj(p) {
  return {
    id: p.id || uid(),
    name: p.name || "",
    category: p.category === "LIFE" || p.category === "생활" ? "생활" : "업무",
    start: p.start || "",
    deadline: p.deadline || "",
    note: p.notes || p.note || ""
  };
}

  not_allowed: "이 계정은 등록돼 있지 않습니다",
  invalid_token: "로그인 정보를 확인하지 못했습니다",
  client_mismatch: "앱 설정과 로그인 정보가 맞지 않습니다",
  email_not_verified: "이메일 인증이 끝나지 않은 계정입니다",
  missing_token: "로그인 정보가 비어 있습니다"
};

function Login(props) {
  var btn = useRef(null);
  var st = useState("");   var err = st[0], setErr = st[1];
  var st2 = useState(false); var busy = st2[0], setBusy = st2[1];

  useEffect(function () {
    var dead = false;
    function init() {
      if (dead) return;
      if (!window.google || !window.google.accounts || !window.google.accounts.id) {
        setTimeout(init, 200); return;
      }
      window.google.accounts.id.initialize({
        client_id: GOOGLE_CLIENT_ID,
        callback: function (resp) {
          setBusy(true); setErr("");
          cloudPost({ action: "googleLogin", idToken: resp.credential })
            .then(function (r) {
              if (!r.ok) throw new Error(LOGIN_ERR[r.error] || r.error || "로그인하지 못했습니다");
              setToken(r.token);
              props.onIn();
            })
            .catch(function (e) { setErr(e.message); setBusy(false); });
        }
      });
      if (btn.current) {
        window.google.accounts.id.renderButton(btn.current, { theme: "filled_black", size: "large", width: 264, shape: "rectangular" });
      }
    }
    init();
    return function () { dead = true; };
  }, []);

  return html`
    <div class="login">
      <div class="logo">taskboard</div>
      <div class="say">등록된 구글 계정으로 들어옵니다</div>
      <div ref=${btn}></div>
      ${busy ? html`<div class="say">확인하는 중…</div>` : null}
      ${err ? html`<div class="err">${err}</div>` : null}
    </div>`;
}

function Row(props) {
  var t = props.task;
  var n = daysLeft(t.due);
  var cls = "d";
  if (!t.done && n !== null) {
    if (n < 0) cls = "d over";
    else if (n <= SOON_DAYS) cls = "d hot";
  }
  var projName = props.projName;
  return html`
    <div class=${"row" + (t.done ? " done" : "")}>
      <button class="box mono" onClick=${function () { props.onToggle(t.id); }}
              aria-pressed=${t.done ? "true" : "false"}
              aria-label=${t.done ? "완료 해제" : "완료 표시"}>${t.done ? "[x]" : "[ ]"}</button>
      <div class="body" role="button" tabindex="0"
           onClick=${function () { props.onOpen(t); }}
           onKeyDown=${function (e) { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); props.onOpen(t); } }}>
        <div class="ttl">${t.title}</div>
        <div class="meta">${projName || t.category}<span class="sep">·</span>${t.status}${t.recurrence && t.recurrence !== "none" ? html`<span class="sep">·</span>반복` : null}</div>
        ${t.note ? html`<div class="note">${t.note.split("\n")[0]}</div>` : null}
      </div>
      <span class=${cls}>${dueLabel(t.due)}</span>
    </div>`;
}

function Calendar(props) {
  var tasks = props.tasks;
  var st = useState(function () { var d = new Date(); return { y: d.getFullYear(), m: d.getMonth() }; });
  var ym = st[0], setYm = st[1];
  var st2 = useState(today()); var sel = st2[0], setSel = st2[1];

  var cells = useMemo(function () {
    var first = new Date(ym.y, ym.m, 1);
    var start = new Date(first);
    start.setDate(1 - first.getDay());
    var out = [];
    for (var i = 0; i < 42; i++) {
      var d = new Date(start);
      d.setDate(start.getDate() + i);
      out.push({ ds: fmtD(d), out: d.getMonth() !== ym.m });
    }
    return out;
  }, [ym.y, ym.m]);

  // 그 날에 걸치는 할 일 (시작~마감 구간)
  function onDay(ds) {
    return tasks.filter(function (t) {
      if (!t.due) return false;
      var s = t.start && t.start <= t.due ? t.start : t.due;
      return s <= ds && ds <= t.due;
    });
  }

  function move(delta) {
    var m = ym.m + delta, y = ym.y;
    if (m < 0) { m = 11; y--; } else if (m > 11) { m = 0; y++; }
    setYm({ y: y, m: m });
  }

  var selTasks = onDay(sel);

  return html`
    <div>
      <div class="calhd">
        <button onClick=${function () { move(-1); }} aria-label="이전 달">‹</button>
        <span class="ym mono">${ym.y}.${pad2(ym.m + 1)}</span>
        <button onClick=${function () { move(1); }} aria-label="다음 달">›</button>
      </div>
      <div class="dow">${DOW.map(function (d) { return html`<div>${d}</div>`; })}</div>
      <div class="grid">
        ${cells.map(function (c) {
          var list = onDay(c.ds);
          var hot = list.some(function (t) { var n = daysLeft(t.due); return !t.done && n !== null && n <= SOON_DAYS; });
          return html`
            <button class=${"cell" + (c.out ? " out" : "") + (c.ds === today() ? " today" : "")}
                    aria-pressed=${c.ds === sel ? "true" : "false"}
                    onClick=${function () { setSel(c.ds); }}>
              <span>${Number(c.ds.slice(8))}</span>
              <span class="dots">
                ${list.slice(0, 3).map(function (t, i) { return html`<i class=${hot && i === 0 ? "hot" : ""}></i>`; })}
              </span>
            </button>`;
        })}
      </div>
      <div class="daylist">
        <div class="hd mono">${sel} · ${selTasks.length}건</div>
        ${selTasks.length === 0
          ? html`<div class="empty"><b>이 날은 비어 있습니다</b></div>`
          : selTasks.map(function (t) {
              return html`<${Row} key=${t.id} task=${t} projName=${props.projName(t)}
                                  onToggle=${props.onToggle} onOpen=${props.onOpen} />`;
            })}
      </div>
    </div>`;
}

// ══════════════════════════════════════════════════════════════
// 할 일 편집 시트
// ══════════════════════════════════════════════════════════════
// 반복 규칙을 사람 말로 되읽어 준다. 「매주」만 눌린 채 무슨 요일인지 모르고 쓰는 일을 막는다.
function repeatSay(f) {
  if (!f.due) return "마감일을 정해야 반복이 돕니다.";
  var base = parseDay(f.due);
  var day = f.monthday || base.getDate();
  if (f.recurrence === "daily") return "완료하면 다음 날짜로 넘어갑니다.";
  if (f.recurrence === "weekly") {
    if (!f.weekdays.length) return "요일을 고르지 않으면 이레마다 돌아옵니다.";
    var names = f.weekdays.slice().sort(function (a, b) { return a - b; })
                  .map(function (i) { return DOW[i]; }).join("·");
    return "매주 " + names + "요일에 돌아옵니다.";
  }
  if (f.recurrence === "biweekly") return "두 주마다 " + DOW[base.getDay()] + "요일에 돌아옵니다.";
  if (f.recurrence === "monthly") {
    return "매월 " + day + "일에 돌아옵니다" + (day > 28 ? " (그 날이 없는 달은 말일)" : "") + ".";
  }
  if (f.recurrence === "yearly") {
    return "해마다 " + (base.getMonth() + 1) + "월 " + day + "일에 돌아옵니다.";
  }
  return "";
}

function AddSheet(props) {
  var editTask = props.task || null;
  var editProj = props.proj || null;
  // 고치는 중이면 갈아탈 수 없다 — 무엇을 고치는지가 이미 정해져 있다
  var locked = editTask ? "task" : editProj ? "proj" : null;

  var m0 = useState(locked || props.initMode || "task"); var mode = m0[0], setMode = m0[1];
  var c0 = useState(false); var confirming = c0[0], setConfirming = c0[1];
  var firstRef = useRef(null);

  // ── 할 일 폼 ──────────────────────────────────────────────
  var t0 = useState(function () {
    var i = editTask;
    return {
      title: i ? i.title : "",
      status: i ? i.status : STATUS[0],
      category: i ? i.category : "업무",
      pid: i ? i.pid : "",
      newProj: "",
      start: i ? i.start : "",
      due: i ? i.due : "",
      note: i ? (i.note || "") : "",
      recurrence: i ? (i.recurrence || "none") : "none",
      weekdays: (i && i.recurrencePattern && i.recurrencePattern.weekdays) || [],
      monthday: (i && i.recurrencePattern && i.recurrencePattern.monthday) || 0,
      endDate: i ? (i.recurrenceEndDate || "") : ""
    };
  });
  var tf = t0[0], setTf = t0[1];
  function upT(k, v) { setTf(function (p) { var n = {}; for (var x in p) n[x] = p[x]; n[k] = v; return n; }); }

  // ── 프로젝트 폼 ───────────────────────────────────────────
  var p0 = useState(function () {
    var i = editProj;
    return {
      name: i ? i.name : "",
      start: i ? (i.start || "") : "",
      deadline: i ? (i.deadline || "") : "",
      note: i ? (i.note || "") : ""
    };
  });
  var pf = p0[0], setPf = p0[1];
  function upP(k, v) { setPf(function (p) { var n = {}; for (var x in p) n[x] = p[x]; n[k] = v; return n; }); }

  // 시트가 올라오는 동안 focus를 주면 브라우저가 무시한다 — 다 올라온 뒤에 준다
  useEffect(function () {
    var id = setTimeout(function () { if (firstRef.current) firstRef.current.focus(); }, 280);
    return function () { clearTimeout(id); };
  }, [mode]);

  // 반복을 고르는 순간 기준을 정해 둔다 — 매주는 마감일의 요일, 매월·매년은 마감일의 날짜.
  function pickRepeat(v) {
    setTf(function (p) {
      var n = {}; for (var x in p) n[x] = p[x];
      n.recurrence = v;
      var base = parseDay(p.due || today());
      if (v === "weekly" && (!p.weekdays || !p.weekdays.length)) n.weekdays = [base.getDay()];
      if (v === "monthly" || v === "yearly") n.monthday = base.getDate();
      return n;
    });
  }
  function toggleDow(i) {
    var arr = tf.weekdays.slice();
    var at = arr.indexOf(i);
    if (at === -1) arr.push(i); else arr.splice(at, 1);
    upT("weekdays", arr);
  }

  function submitTask() {
    var title = tf.title.trim();
    if (!title) return;
    var pattern = {};
    if (tf.recurrence === "weekly") pattern = { weekdays: tf.weekdays };
    else if (tf.recurrence === "monthly" || tf.recurrence === "yearly") {
      pattern = { monthday: tf.monthday || parseDay(tf.due || today()).getDate() };
    }
    props.onSaveTask({
      id: editTask ? editTask.id : null,
      title: title, note: tf.note, status: tf.status, category: tf.category,
      pid: tf.pid, newProj: tf.newProj.trim(),
      start: tf.start, due: tf.due,
      recurrence: tf.recurrence, recurrencePattern: pattern,
      recurrenceEndDate: tf.recurrence === "none" ? "" : tf.endDate
    });
  }

  function submitProj() {
    var name = pf.name.trim();
    if (!name) return;
    props.onSaveProj({
      id: editProj ? editProj.id : null,
      name: name, start: pf.start, deadline: pf.deadline, note: pf.note,
      category: editProj ? editProj.category : "업무"
    });
  }

  var title = editTask ? "할 일 고치기" : editProj ? "프로젝트 고치기" : "새로 만들기";

  return html`
    <div class="sheet">
      <div class="sheet-in">
        <div class="sheet-hd">
          <h2>${title}</h2>
          <button onClick=${props.onClose}>닫기</button>
        </div>

        ${!locked ? html`
          <div class="seg">
            <button aria-pressed=${mode === "task" ? "true" : "false"}
                    onClick=${function () { setMode("task"); }}>할 일</button>
            <button aria-pressed=${mode === "proj" ? "true" : "false"}
                    onClick=${function () { setMode("proj"); }}>프로젝트</button>
          </div>` : null}

        ${mode === "task" ? html`
          <div class="field">
            <label for="tb-title">할 일</label>
            <input id="tb-title" ref=${mode === "task" ? firstRef : null} value=${tf.title}
                   onInput=${function (e) { upT("title", e.target.value); }}
                   onKeyDown=${function (e) { if (e.key === "Enter") submitTask(); }} />
          </div>

          <div class="field">
            <label>분류</label>
            <div class="pick">
              ${STATUS.map(function (s) {
                return html`<button aria-pressed=${tf.status === s ? "true" : "false"}
                                    onClick=${function () { upT("status", s); }}>${s}</button>`;
              })}
            </div>
          </div>

          <div class="field">
            <label>업무 · 생활</label>
            <div class="pick">
              ${CATS.map(function (c) {
                return html`<button aria-pressed=${tf.category === c ? "true" : "false"}
                                    onClick=${function () { upT("category", c); }}>${c}</button>`;
              })}
            </div>
          </div>

          <div class="field">
            <label for="tb-proj">프로젝트</label>
            <select id="tb-proj" value=${tf.pid} onChange=${function (e) { upT("pid", e.target.value); }}>
              <option value="">없음</option>
              ${props.projects.map(function (p) { return html`<option value=${p.id}>${p.name}</option>`; })}
            </select>
            <input style="margin-top:7px" placeholder="여기 적으면 새 프로젝트로 만들어 붙입니다"
                   value=${tf.newProj} onInput=${function (e) { upT("newProj", e.target.value); }} />
          </div>

          <div class="field duo">
            <div>
              <label for="tb-s">시작</label>
              <input id="tb-s" type="date" value=${tf.start} onInput=${function (e) { upT("start", e.target.value); }} />
            </div>
            <div>
              <label for="tb-e">마감</label>
              <input id="tb-e" type="date" value=${tf.due} onInput=${function (e) { upT("due", e.target.value); }} />
            </div>
          </div>

          <div class="field">
            <label>반복</label>
            <div class="pick">
              ${REPEATS.map(function (r) {
                return html`<button aria-pressed=${tf.recurrence === r.v ? "true" : "false"}
                                    onClick=${function () { pickRepeat(r.v); }}>${r.l}</button>`;
              })}
            </div>
            ${tf.recurrence === "weekly" ? html`
              <div class="pick" style="margin-top:7px">
                ${DOW.map(function (d, i) {
                  return html`<button aria-pressed=${tf.weekdays.indexOf(i) !== -1 ? "true" : "false"}
                                      onClick=${function () { toggleDow(i); }}>${d}</button>`;
                })}
              </div>` : null}
            ${tf.recurrence !== "none" ? html`
              <div style="margin-top:9px">
                <label for="tb-rend">반복 종료 (비워두면 계속)</label>
                <input id="tb-rend" type="date" value=${tf.endDate}
                       onInput=${function (e) { upT("endDate", e.target.value); }} />
              </div>
              <div class="hintline">${repeatSay(tf)}</div>` : null}
          </div>

          <div class="field">
            <label for="tb-note">비고</label>
            <textarea id="tb-note" rows="4" placeholder="적어 둘 것 — 연락처, 조건, 준비물, 무엇이든"
                      value=${tf.note} onInput=${function (e) { upT("note", e.target.value); }}></textarea>
          </div>

          ${editTask && confirming ? html`
            <div class="warnbox">이 할 일을 지웁니다. 되돌릴 수 없습니다.</div>
            <div class="actions">
              <button onClick=${function () { setConfirming(false); }}>그만</button>
              <button class="go" onClick=${function () { props.onDeleteTask(editTask.id); }}>지웁니다</button>
            </div>`
          : html`
            <div class="actions">
              ${editTask ? html`<button class="danger" onClick=${function () { setConfirming(true); }}>지우기</button>` : null}
              <button class="go" onClick=${submitTask}>${editTask ? "고치기" : "추가"}</button>
            </div>`}
        ` : html`
          <div class="field">
            <label for="pj-name">프로젝트명</label>
            <input id="pj-name" ref=${mode === "proj" ? firstRef : null} value=${pf.name}
                   onInput=${function (e) { upP("name", e.target.value); }}
                   onKeyDown=${function (e) { if (e.key === "Enter") submitProj(); }} />
          </div>

          <div class="field duo">
            <div>
              <label for="pj-s">시작</label>
              <input id="pj-s" type="date" value=${pf.start} onInput=${function (e) { upP("start", e.target.value); }} />
            </div>
            <div>
              <label for="pj-e">마감</label>
              <input id="pj-e" type="date" value=${pf.deadline} onInput=${function (e) { upP("deadline", e.target.value); }} />
            </div>
          </div>
          <div class="hintline">기한은 둘 다 비워둬도 됩니다. 마감을 모르면 시작만 적어 두세요.</div>

          <div class="field" style="margin-top:13px">
            <label for="pj-note">비고</label>
            <textarea id="pj-note" rows="4" placeholder="발주처, 금액, 조건 — 무엇이든"
                      value=${pf.note} onInput=${function (e) { upP("note", e.target.value); }}></textarea>
          </div>

          ${editProj && confirming ? html`
            <div class="warnbox">
              정말 지울까요? 딸린 할 일 ${props.taskCount}건은 지워지지 않고 프로젝트만 떨어집니다.
            </div>
            <div class="actions">
              <button onClick=${function () { setConfirming(false); }}>그만</button>
              <button class="go" onClick=${function () { props.onDeleteProj(editProj.id); }}>지웁니다</button>
            </div>`
          : html`
            <div class="actions">
              ${editProj ? html`<button class="danger" onClick=${function () { setConfirming(true); }}>지우기</button>` : null}
              <button class="go" onClick=${submitProj}>${editProj ? "고치기" : "만들기"}</button>
            </div>`}
        `}
      </div>
    </div>`;
}

// 설정 — 하단 시트가 아니라 온전한 한 화면이다.
// 종전에는 시트로 떠서 위쪽 절반이 빈 채로 남았고, 프로젝트를 만들 자리도 없었다.
function ConfigView(props) {
  return html`
    <div>
      <div class="sect-row">
        <span class="sect">프로젝트 ${props.projects.length}</span>
        <button class="mini" onClick=${props.onNewProj}>＋ 새로 만들기</button>
      </div>

      ${props.projects.length === 0
        ? html`<div class="empty">
                 <b>아직 프로젝트가 없습니다</b>
                 위 「＋ 새로 만들기」로 만들거나,<br />
                 할 일을 추가할 때 그 자리에서 만들 수 있습니다
               </div>`
        : props.projects.map(function (p) {
            var mine = props.tasks.filter(function (t) { return t.pid === p.id; });
            var open = mine.filter(function (t) { return !t.done; }).length;
            return html`
              <div class="line" role="button" tabindex="0" key=${p.id}
                   onClick=${function () { props.onEditProj(p); }}
                   onKeyDown=${function (e) { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); props.onEditProj(p); } }}>
                <div class="grow">
                  <div class="name">${p.name}</div>
                  <div class="sub">
                    할 일 ${mine.length}건${open ? " (진행 " + open + ")" : ""}
                    ${p.start || p.deadline ? html`<span class="sep"> · </span>${(p.start || "") + (p.start && p.deadline ? " ~ " : "") + (p.deadline || (p.start ? " ~" : ""))}` : null}
                  </div>
                  ${p.note ? html`<div class="pnote">${p.note.split("\n")[0]}</div>` : null}
                </div>
                <span class="chev mono">고치기</span>
              </div>`;
          })}

      <div class="sect">구글 캘린더</div>
      <div class="line">
        <div class="grow">
          <div class="name">마감일을 캘린더로 보내기</div>
          <div class="sub">마감이 있는 할 일만 종일 일정으로 올립니다</div>
        </div>
        <button class="act" disabled=${props.gcalBusy}
                onClick=${props.onGcal}>${props.gcalBusy ? "보내는 중" : "보내기"}</button>
      </div>

      <div class="sect">마감 알림</div>
      <div class="line">
        <div class="grow">
          <div class="name">${props.notifyState === "granted" ? "켜져 있습니다" : props.notifyState === "denied" ? "브라우저에서 막혀 있습니다" : props.notifyState === "unsupported" ? "이 브라우저는 지원하지 않습니다" : "꺼져 있습니다"}</div>
          <div class="sub">마감 ${SOON_DAYS}일 전부터 하루 한 번 알립니다</div>
        </div>
        ${props.notifyState === "default"
          ? html`<button class="act" onClick=${props.onAskNotify}>켜기</button>`
          : null}
      </div>

      <div class="sect">계정</div>
      <div class="line">
        <div class="grow"><div class="name">로그아웃</div><div class="sub">이 기기에서만 나갑니다</div></div>
        <button class="act" onClick=${props.onLogout}>나가기</button>
      </div>

      <div class="hintline" style="padding:16px var(--pad) 26px">
        자료는 구글 스프레드시트에 저장됩니다. 연결이 끊긴 동안에는 아무것도 저장하지 않고,
        다시 이어지면 마지막 변경을 자동으로 올립니다.
      </div>
    </div>`;
}

// ══════════════════════════════════════════════════════════════
// 본체
// ══════════════════════════════════════════════════════════════
function App() {
  var a0 = useState(function () { return !!getToken(); }); var authed = a0[0], setAuthed = a0[1];

  // hydrated — 서버에서 자료를 「한 번이라도」 받았는가.
  // 이 값이 false인 동안 저장 함수는 전부 즉시 반환한다. 데이터 안전의 핵심 자물쇠다.
  var hydRef = useRef(false);
  var h0 = useState(false); var hydrated = h0[0], setHydrated = h0[1];

  var l0 = useState("loading"); var phase = l0[0], setPhase = l0[1];  // loading | ready | offline
  var p0 = useState([]); var projects = p0[0], setProjects = p0[1];
  var t0 = useState([]); var tasks = t0[0], setTasks = t0[1];

  var f0 = useState(FILTERS[0]); var filter = f0[0], setFilter = f0[1];
  var v0 = useState("tasks"); var view = v0[0], setView = v0[1];
  var s0 = useState(null); var sheet = s0[0], setSheet = s0[1];       // null | {task} | "new" | "settings"
  var g0 = useState(false); var gcalBusy = g0[0], setGcalBusy = g0[1];
  var e0 = useState(""); var saveErr = e0[0], setSaveErr = e0[1];
  var m0 = useState(null); var toast = m0[0], setToast = m0[1];
  var k0 = useState(false); var linkLost = k0[0], setLinkLost = k0[1];
  var n0 = useState(function () {
    return ("Notification" in window) ? Notification.permission : "unsupported";
  }); var notifyState = n0[0], setNotifyState = n0[1];

  var stampRef = useRef({});      // 키별 updatedAt — 폴링 비교용
  var pendingRef = useRef({});    // 저장 실패분 — 연결 복구 시 재전송
  var notifiedRef = useRef({});   // 알림 중복 방지

  function say(msg) {
    setToast(msg);
    setTimeout(function () { setToast(null); }, 2600);
  }

  function forceLogout() {
    setToken(null);
    hydRef.current = false;
    setHydrated(false);
    setAuthed(false);
    setPhase("loading");
    setProjects([]); setTasks([]);
  }

  // ── 저장 ──────────────────────────────────────────────────
  // ⛔ 이 함수가 서버로 나가는 유일한 통로다. hydrated 자물쇠를 여기 한 곳에서만 건다.
  function push(key, value) {
    if (!hydRef.current) return;              // ← 자물쇠. 받은 적 없으면 절대 안 보낸다
    var json = JSON.stringify(value);
    pendingRef.current[key] = json;
    cloudPost({ action: "set", key: key, value: json })
      .then(function (r) {
        if (!r.ok) throw new Error(r.error || "저장하지 못했습니다");
        stampRef.current[key] = r.updatedAt;
        if (pendingRef.current[key] === json) delete pendingRef.current[key];
        setSaveErr("");
      })
      .catch(function (e) {
        if (isAuthError(e)) { forceLogout(); return; }
        setSaveErr("저장하지 못했습니다 — 연결되면 다시 올립니다");
      });
  }
  function saveTasks(next) { push("tmv3_tasks", next); }
  function saveProjects(next) { push("tmv3_proj", next); }

  // 실패분 재전송
  function flushPending() {
    var keys = Object.keys(pendingRef.current);
    if (!keys.length) return;
    keys.forEach(function (key) {
      var json = pendingRef.current[key];
      cloudPost({ action: "set", key: key, value: json })
        .then(function (r) {
          if (!r.ok) return;
          stampRef.current[key] = r.updatedAt;
          if (pendingRef.current[key] === json) delete pendingRef.current[key];
          if (!Object.keys(pendingRef.current).length) { setSaveErr(""); say("밀린 변경을 올렸습니다"); }
        })
        .catch(function () {});
    });
  }

  // ── 적재 ──────────────────────────────────────────────────
  // 서버 응답을 화면에 앉히는 유일한 자리. 자물쇠도 여기서만 열린다.
  function adopt(all) {
    var pr = all.tmv3_proj && all.tmv3_proj.value ? JSON.parse(all.tmv3_proj.value) : [];
    var tk = all.tmv3_tasks && all.tmv3_tasks.value ? JSON.parse(all.tmv3_tasks.value) : [];
    stampRef.current.tmv3_proj = all.tmv3_proj ? all.tmv3_proj.updatedAt : null;
    stampRef.current.tmv3_tasks = all.tmv3_tasks ? all.tmv3_tasks.updatedAt : null;
    setProjects(pr.map(migrateProj));
    setTasks(tk.map(migrateTask));
    hydRef.current = true;
    setHydrated(true);
    setPhase("ready");
  }

  function load() {
    setPhase(hydRef.current ? "ready" : "loading");
    return cloudGetAll()
      .then(function (all) {
        adopt(all);
        setLinkLost(false);
        flushPending();
      })
      .catch(function (e) {
        if (isAuthError(e)) { forceLogout(); return; }
        // ⛔ 견본 데이터를 채우지 않는다. 없는 자료를 지어내면 그것이 원본을 덮는다.
        setPhase("offline");
      });
  }

  useEffect(function () {
    if (!authed) return;
    var dead = false;
    cloudGetAll()
      .then(function (all) {
        if (dead) return;
        adopt(all);
        setLinkLost(false);
      })
      .catch(function (e) {
        if (dead) return;
        if (isAuthError(e)) { forceLogout(); return; }
        setPhase("offline");
      });
    return function () { dead = true; };
  }, [authed]);

  // ── 주기 동기화 ───────────────────────────────────────────
  // 한 번 자료를 받은 뒤에는 연결이 끊겨도 목록을 감추지 않는다.
  // 손에 든 것은 서버에서 온 진짜 자료이므로 계속 보여주고, 저장만 미뤄 뒀다 올린다.
  useEffect(function () {
    if (!authed) return;
    var iv = setInterval(function () {
      cloudGetAll()
        .then(function (all) {
          setLinkLost(false);
          if (!hydRef.current) { adopt(all); flushPending(); return; }

          // 아직 못 올린 변경이 있으면 서버 것을 받지 않는다 — 받으면 내 변경이 되감긴다.
          if (Object.keys(pendingRef.current).length) { flushPending(); return; }

          if (all.tmv3_proj && all.tmv3_proj.updatedAt && all.tmv3_proj.updatedAt !== stampRef.current.tmv3_proj) {
            stampRef.current.tmv3_proj = all.tmv3_proj.updatedAt;
            setProjects(JSON.parse(all.tmv3_proj.value).map(migrateProj));
          }
          if (all.tmv3_tasks && all.tmv3_tasks.updatedAt && all.tmv3_tasks.updatedAt !== stampRef.current.tmv3_tasks) {
            stampRef.current.tmv3_tasks = all.tmv3_tasks.updatedAt;
            setTasks(JSON.parse(all.tmv3_tasks.value).map(migrateTask));
          }
        })
        .catch(function (e) {
          if (isAuthError(e)) { forceLogout(); return; }
          setLinkLost(true);
          if (!hydRef.current) setPhase("offline");
        });
    }, SYNC_MS);
    return function () { clearInterval(iv); };
  }, [authed]);

  // ── 마감 알림 ─────────────────────────────────────────────
  useEffect(function () {
    if (phase !== "ready") return;
    function check() {
      var td = today();
      tasks.forEach(function (t) {
        if (t.done || !t.due) return;
        var n = daysLeft(t.due);
        if (n === null || n < 0 || n > SOON_DAYS) return;
        var key = t.id + "_" + n + "_" + td;
        if (notifiedRef.current[key]) return;
        notifiedRef.current[key] = true;
        if ("Notification" in window && Notification.permission === "granted") {
          try {
            new Notification("taskboard", { body: (n === 0 ? "오늘 마감 · " : "D-" + n + " · ") + t.title });
          } catch (e) {}
        }
      });
    }
    check();
    var iv = setInterval(check, 60000);
    return function () { clearInterval(iv); };
  }, [phase, tasks]);

  // ── 조작 ──────────────────────────────────────────────────
  var PM = useMemo(function () {
    var m = {};
    projects.forEach(function (p) { m[p.id] = p; });
    return m;
  }, [projects]);

  function projName(t) { return PM[t.pid] ? PM[t.pid].name : ""; }

  function toggleDone(id) {
    var moved = null;
    setTasks(function (prev) {
      var next = prev.map(function (t) {
        if (t.id !== id) return t;
        if (!t.done) {
          var nd = nextRepeat(t);
          if (nd) {
            var c = {}; for (var k in t) c[k] = t[k];
            // 기간이 있으면 시작일도 같은 폭만큼 민다.
            // 안 그러면 회차를 거듭할수록 기간이 늘어나 달력 막대가 계속 길어진다.
            if (t.start && t.start <= t.due) {
              var span = Math.round((parseDay(t.due) - parseDay(t.start)) / 86400000);
              var ns = parseDay(nd);
              ns.setDate(ns.getDate() - span);
              c.start = fmtD(ns);
            }
            c.due = nd; c.done = false;
            moved = nd;
            return c;
          }
          if (t.recurrence && t.recurrence !== "none") moved = "end";
        }
        var c2 = {}; for (var k2 in t) c2[k2] = t[k2];
        c2.done = !t.done;
        return c2;
      });
      saveTasks(next);
      return next;
    });
    // 반복은 눌러도 목록에서 사라지지 않으므로, 무슨 일이 일어났는지 말해 준다
    if (moved === "end") say("반복이 끝났습니다 — 완료로 넘겼습니다");
    else if (moved) say("다음은 " + moved + " (" + DOW[parseDay(moved).getDay()] + ")");
  }

  function saveTask(form) {
    var pid = form.pid;
    var madeProj = null;

    if (form.newProj) {
      madeProj = { id: uid(), name: form.newProj, category: form.category, deadline: "", note: "" };
      pid = madeProj.id;
      setProjects(function (prev) {
        var next = prev.concat([madeProj]);
        saveProjects(next);
        return next;
      });
    }

    setTasks(function (prev) {
      var next;
      if (form.id) {
        next = prev.map(function (t) {
          if (t.id !== form.id) return t;
          var c = {}; for (var k in t) c[k] = t[k];
          c.title = form.title; c.note = form.note;
          c.status = form.status; c.category = form.category;
          c.pid = pid; c.start = form.start; c.due = form.due;
          c.recurrence = form.recurrence; c.recurrencePattern = form.recurrencePattern;
          c.recurrenceEndDate = form.recurrenceEndDate;
          return c;
        });
      } else {
        next = prev.concat([{
          id: uid(), pid: pid, title: form.title, note: form.note,
          status: form.status, category: form.category,
          start: form.start, due: form.due, done: false,
          recurrence: form.recurrence, recurrencePattern: form.recurrencePattern,
          recurrenceEndDate: form.recurrenceEndDate, created: Date.now()
        }]);
      }
      saveTasks(next);
      return next;
    });

    setSheet(null);
    say(form.id ? "고쳤습니다" : "추가했습니다");
  }

  function deleteTask(id) {
    setTasks(function (prev) {
      var next = prev.filter(function (t) { return t.id !== id; });
      saveTasks(next);
      return next;
    });
    setSheet(null);
    say("지웠습니다");
  }

  // 프로젝트 만들기·고치기 겸용
  function saveProj(form) {
    setProjects(function (prev) {
      var next;
      if (form.id) {
        next = prev.map(function (p) {
          if (p.id !== form.id) return p;
          var c = {}; for (var k in p) c[k] = p[k];
          c.name = form.name; c.start = form.start; c.deadline = form.deadline; c.note = form.note;
          return c;
        });
      } else {
        next = prev.concat([{
          id: uid(), name: form.name, category: form.category || "업무",
          start: form.start, deadline: form.deadline, note: form.note
        }]);
      }
      saveProjects(next);
      return next;
    });
    setSheet(null);
    say(form.id ? "고쳤습니다" : "\"" + form.name + "\" 프로젝트를 만들었습니다");
  }

  function deleteProj(id) {
    setProjects(function (prev) {
      var next = prev.filter(function (p) { return p.id !== id; });
      saveProjects(next);
      return next;
    });
    setTasks(function (prev) {
      var next = prev.map(function (t) {
        if (t.pid !== id) return t;
        var c = {}; for (var k in t) c[k] = t[k];
        c.pid = "";
        return c;
      });
      saveTasks(next);
      return next;
    });
    setSheet(null);
    say("프로젝트를 지웠습니다 — 할 일은 남습니다");
  }

  function sendGcal() {
    if (!hydRef.current) { say("연결된 뒤에 보낼 수 있습니다"); return; }
    setGcalBusy(true);
    var payload = tasks.map(function (t) {
      return {
        id: t.id, title: t.title, start: t.start, due: t.due, done: t.done,
        category: t.category === "생활" ? "LIFE" : "WORK",
        project: projName(t)
      };
    });
    cloudPost({ action: "gcalSync", tasks: payload })
      .then(function (r) {
        setGcalBusy(false);
        if (!r.ok) { say("보내지 못했습니다"); return; }
        say("캘린더로 보냈습니다 · 새로 " + r.created + " · 고침 " + r.updated + " · 정리 " + r.removed);
      })
      .catch(function (e) {
        setGcalBusy(false);
        if (isAuthError(e)) { forceLogout(); return; }
        say("보내지 못했습니다");
      });
  }

  // ── 보이는 목록 ───────────────────────────────────────────
  var visible = useMemo(function () {
    var out = tasks.filter(function (t) {
      if (filter === "진행중") return !t.done;
      if (filter === "기한임박") {
        if (t.done || !t.due) return false;
        var n = daysLeft(t.due);
        return n !== null && n <= SOON_DAYS;
      }
      return true;
    });
    return out.sort(function (a, b) {
      if (a.done !== b.done) return a.done ? 1 : -1;            // 완료는 아래로
      if (a.status !== b.status) return a.status === "우선" ? -1 : 1;
      var ad = a.due || "9999-12-31", bd = b.due || "9999-12-31";
      if (ad !== bd) return ad < bd ? -1 : 1;
      return b.created - a.created;
    });
  }, [tasks, filter]);

  var counts = useMemo(function () {
    var open = tasks.filter(function (t) { return !t.done; });
    var soon = open.filter(function (t) {
      if (!t.due) return false;
      var n = daysLeft(t.due);
      return n !== null && n <= SOON_DAYS;
    });
    return { open: open.length, soon: soon.length };
  }, [tasks]);

  if (!authed) return html`<${Login} onIn=${function () { setAuthed(true); }} />`;

  var now = new Date();
  // 지금 보고 있는 것을 명령 한 줄로 되비춘다. 달력일 때는 필터가 아니라 그 달을 말한다.
  var cmdText = view === "config" ? "config"
              : view === "calendar" ? "calendar"
              : filter === "진행중" ? "tasks --active"
              : filter === "기한임박" ? "tasks --due " + SOON_DAYS + "d"
              : "tasks --all";

  return html`
    <div id="app">
      <div class="top">
        <span class="brand">taskboard</span>
        <span class="today mono">${fmtD(now)} ${DOW[now.getDay()]}</span>
      </div>

      <div class="cmd">${">"} <b>${cmdText}</b>${phase === "ready" ? html`<span> — ${
        view === "config"
          ? "프로젝트 " + projects.length + " · 할 일 " + tasks.length
          : counts.open + "건 진행중 · " + counts.soon + "건 " + SOON_DAYS + "일 안"
      }</span>` : null}<span class="caret"></span></div>

      ${phase === "offline" ? html`
        <div class="banner warn">
          <span>연결 없음 — 자료를 불러오지 못했습니다</span>
          <button onClick=${load}>다시</button>
        </div>` : null}

      ${phase === "ready" && linkLost ? html`
        <div class="banner warn">
          <span>연결이 끊겼습니다 — 화면은 마지막으로 받은 자료입니다</span>
          <button onClick=${load}>다시</button>
        </div>` : null}

      ${saveErr ? html`<div class="banner warn"><span>${saveErr}</span></div>` : null}

      ${view === "tasks" && phase === "ready" ? html`
        <div class="tabsel">
          ${FILTERS.map(function (f) {
            return html`<button aria-pressed=${filter === f ? "true" : "false"}
                                onClick=${function () { setFilter(f); }}>${f}</button>`;
          })}
        </div>` : null}

      <div class="scroll">
        ${phase === "loading" ? html`<div class="empty mono"><b>불러오는 중…</b></div>` : null}

        ${phase === "offline" ? html`
          <div class="empty">
            <b>화면에 아무것도 채우지 않았습니다</b>
            없는 자료를 지어내면 그것이 원본을 덮습니다.<br />
            연결이 돌아오면 30초 안에 스스로 이어집니다.
          </div>` : null}

        ${phase === "ready" && view === "tasks" ? (
          visible.length === 0
            ? html`<div class="empty">
                     <b>${filter === "전체" ? "아직 할 일이 없습니다" : "여기는 비었습니다"}</b>
                     오른쪽 아래 ＋ 로 하나 만들어 보세요
                   </div>`
            : visible.map(function (t) {
                return html`<${Row} key=${t.id} task=${t} projName=${projName(t)}
                                    onToggle=${toggleDone}
                                    onOpen=${function (task) { setSheet({ task: task }); }} />`;
              })
        ) : null}

        ${phase === "ready" && view === "calendar" ? html`
          <${Calendar} tasks=${tasks} projName=${projName} onToggle=${toggleDone}
                       onOpen=${function (task) { setSheet({ task: task }); }} />` : null}

        ${phase === "ready" && view === "config" ? html`
          <${ConfigView} projects=${projects} tasks=${tasks}
                         gcalBusy=${gcalBusy} onGcal=${sendGcal}
                         notifyState=${notifyState}
                         onNewProj=${function () { setSheet({ proj: null, newProj: true }); }}
                         onEditProj=${function (p) { setSheet({ proj: p }); }}
                         onAskNotify=${function () {
                           if (!("Notification" in window)) return;
                           try {
                             Notification.requestPermission().then(function (p) { setNotifyState(p); });
                           } catch (e) {
                             Notification.requestPermission(function (p) { setNotifyState(p); });
                           }
                         }}
                         onLogout=${function () {
                           cloudPost({ action: "logout" }).catch(function () {});
                           forceLogout();
                         }} />` : null}
      </div>

      ${phase === "ready" && view !== "config" ? html`
        <button class="fab" onClick=${function () { setSheet({}); }} aria-label="새로 만들기">＋</button>` : null}

      <div class="tabs">
        <button aria-current=${view === "tasks" ? "page" : null} onClick=${function () { setView("tasks"); }}>tasks</button>
        <button aria-current=${view === "calendar" ? "page" : null} onClick=${function () { setView("calendar"); }}>calendar</button>
        <button aria-current=${view === "config" ? "page" : null} onClick=${function () { setView("config"); }}>config</button>
      </div>

      ${toast ? html`<div class="toast">${toast}</div>` : null}

      ${sheet ? html`
        <${AddSheet} task=${sheet.task || null} proj=${sheet.proj || null}
                     initMode=${sheet.newProj ? "proj" : "task"}
                     projects=${projects}
                     taskCount=${sheet.proj ? tasks.filter(function (t) { return t.pid === sheet.proj.id; }).length : 0}
                     onSaveTask=${saveTask} onDeleteTask=${deleteTask}
                     onSaveProj=${saveProj} onDeleteProj=${deleteProj}
                     onClose=${function () { setSheet(null); }} />` : null}

    </div>`;
}

render(html`<${App} />`, document.getElementById("root"));

// 알림 권한은 설정에서 「켜기」를 눌렀을 때만 물어본다.
// 사용자 조작 없이 requestPermission을 부르면 브라우저가 무시하거나 경고를 남긴다.

if ("serviceWorker" in navigator) {
  window.addEventListener("load", function () {
    navigator.serviceWorker.register("sw.js").catch(function () {});
  });
}
})();
</script>
</body>
</html>
